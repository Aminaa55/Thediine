<title>The Diine Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;700&display=swap">

<style>
/* The Diine admin, in the brand's own system: three creams, a brown ink, gold
   as the accent. Semantic colour is separate from the accent and used only for
   state -- a payment that needs checking, a payment that has landed.
   Single-theme by design, like the site: every colour painted explicitly so the
   page holds whatever ground it is dropped on. */
:root{
  --cream:#FBF1E4; --cream-warm:#FFFAF3; --cream-deep:#F4E5CE; --cream-toast:#EBD7B4;
  --ink:#3B2310; --ink-soft:#6E523A; --ink-faint:#9A7E62;
  --gold:#A87E2E; --gold-pale:#EFE2BE;
  --line:#E4CFAF; --line-soft:#EFE0C8;
  --alert:#A6391C; --paid:#2E6B45;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--cream); color:var(--ink);
  font-family:Karla,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Fraunces,Georgia,serif; font-weight:600; margin:0; line-height:1.2;
  text-wrap:balance}
p{margin:0}
ul,ol{margin:0; padding:0; list-style:none}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
a{color:inherit; text-decoration:none}
:focus-visible{outline:2px solid var(--gold); outline-offset:3px; border-radius:2px}
.tnum{font-variant-numeric:tabular-nums}

/* ------------------------------------------------------------- the banner */
.demo{background:var(--ink); color:var(--cream); font-size:13.5px; line-height:1.5}
.demo .in{max-width:1100px; margin:0 auto; padding:10px 20px; display:flex; flex-wrap:wrap;
  align-items:center; gap:8px 20px}
.demo strong{color:#F0D9A6; font-weight:700}
.demo button{margin-left:auto; background:none; border:1px solid rgba(251,241,228,.35);
  color:var(--cream); border-radius:999px; padding:4px 14px; font-size:12.5px}
.demo button:hover{border-color:var(--cream)}

/* -------------------------------------------------------------- the chrome */
.top{border-bottom:1px solid var(--line); background:var(--cream-warm)}
.top .in{max-width:1100px; margin:0 auto; padding:16px 20px; display:flex; flex-wrap:wrap;
  align-items:center; gap:10px 28px}
.brand{font-family:Fraunces,Georgia,serif; font-size:19px; font-weight:600}
.brand .tag{margin-left:8px; border:1px solid rgba(168,126,46,.45); border-radius:999px;
  padding:2px 9px; font-family:Karla,sans-serif; font-size:10px; font-weight:700;
  letter-spacing:.18em; text-transform:uppercase; color:var(--gold)}
.top nav{display:flex; gap:24px}
.top nav a{font-size:15px; color:var(--ink-soft)}
.top nav a:hover,.top nav a.on{color:var(--ink)}
.top nav a.on{font-weight:700}
.who{margin-left:auto; display:flex; align-items:center; gap:20px; font-size:14px;
  color:var(--ink-soft)}
.who button{background:none; border:0; padding:0; font-size:14px; color:var(--ink-faint);
  text-decoration:underline; text-underline-offset:4px}
.who button:hover{color:var(--ink)}
main{max-width:1100px; margin:0 auto; padding:40px 20px 72px}

/* ------------------------------------------------------------------- type */
.eyebrow{font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold)}
.lab{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint)}
h1{font-size:30px; margin-top:12px}
.sub{margin-top:12px; font-size:15.5px; color:var(--ink-soft)}

/* ------------------------------------------------------------------ cards */
.card{border:1px solid var(--line); background:var(--cream-warm); border-radius:2px}
.card > header{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between;
  gap:16px; border-bottom:1px solid var(--line); padding:16px 24px}
.card > header h2{font-size:18px}
.card > .body{padding:20px 24px}
.grid{display:grid; gap:24px}
@media(min-width:900px){
  .cols{grid-template-columns:minmax(0,1fr) 380px; align-items:start}
  .cols > .side{position:sticky; top:24px}
  .k-cols{grid-template-columns:minmax(0,1fr) 320px; align-items:start}
}

/* ------------------------------------------------------------------ stats */
.stats{display:grid; gap:16px; margin-top:32px}
@media(min-width:700px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{display:block; border:1px solid var(--line); background:var(--cream-warm);
  border-radius:2px; padding:20px; transition:border-color .2s}
.stat:hover{border-color:var(--gold)}
.stat .n{margin-top:8px; font-family:Fraunces,Georgia,serif; font-size:28px; font-weight:600}
.stat.alert{border-color:rgba(166,57,28,.35); background:rgba(166,57,28,.06)}
.stat.alert:hover{border-color:rgba(166,57,28,.6)}
.stat.alert .n{color:var(--alert)}

/* ------------------------------------------------------------------ pills */
.pill{display:inline-block; white-space:nowrap; border:1px solid; border-radius:999px;
  padding:3px 12px; font-size:12.5px}
.st-REQUESTED{border-color:rgba(168,126,46,.5); background:rgba(239,226,190,.5); color:var(--ink)}
.st-NEW{border-color:rgba(59,35,16,.25); background:var(--cream-deep); color:var(--ink)}
.st-CONFIRMED{border-color:var(--ink); background:var(--ink); color:var(--cream)}
.st-PREPARING,.st-READY,.st-OUT_FOR_DELIVERY{border-color:var(--gold);
  background:rgba(168,126,46,.22); color:var(--ink)}
.st-DELIVERED{border-color:var(--line); background:var(--cream); color:var(--ink-faint)}
.st-CANCELLED{border-color:rgba(166,57,28,.35); background:rgba(166,57,28,.08); color:var(--alert)}
.pay-UNPAID{border-color:var(--line); background:var(--cream); color:var(--ink-soft)}
.pay-AWAITING_VERIFICATION{border-color:rgba(166,57,28,.35); background:rgba(166,57,28,.07);
  color:var(--alert)}
.pay-PAID{border-color:rgba(46,107,69,.35); background:rgba(46,107,69,.08); color:var(--paid)}
.pay-REFUNDED{border-color:var(--line); background:var(--cream); color:var(--ink-faint)}
.type{display:inline-block; white-space:nowrap; border:1px solid var(--line); border-radius:999px;
  padding:1px 10px; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-faint)}
.type.ev{border-color:rgba(168,126,46,.5); color:var(--gold)}

/* ------------------------------------------------------------------- rows */
.rows{border-top:1px solid var(--line-soft)}
.rows li{border-bottom:1px solid var(--line-soft)}
.row{display:flex; flex-wrap:wrap; align-items:center; gap:8px 20px; padding:16px 24px;
  transition:background-color .15s}
a.row:hover{background:var(--cream)}
.row .num{font-family:Fraunces,Georgia,serif; font-size:16px; font-weight:600}
.row .name{font-size:15px}
.row .mob{font-size:13.5px; color:var(--ink-faint)}
.row .when{font-size:14px; color:var(--ink-soft)}
.row .when span{display:block; font-size:13px; color:var(--ink-faint)}
.row .end{margin-left:auto; display:flex; flex-wrap:wrap; align-items:center; gap:12px}
.row .amt{font-family:Fraunces,Georgia,serif; font-size:15.5px; font-weight:600}

/* ------------------------------------------------------------------ chips */
.chips{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:28px}
.chip{border:1px solid var(--line); background:var(--cream-warm); border-radius:999px;
  padding:6px 16px; font-size:14px; color:var(--ink-soft); transition:border-color .2s}
.chip:hover{border-color:rgba(59,35,16,.4)}
.chip.on{border-color:var(--ink); background:var(--ink); color:var(--cream)}
.search{margin-left:auto; display:flex; align-items:center; gap:10px}
.search input{width:230px; border:1px solid var(--line); background:var(--cream-warm);
  border-radius:999px; padding:7px 16px; font-size:14.5px}
.search input:focus{outline:none; border-color:var(--gold)}

/* ------------------------------------------------------------- order page */
.crumb{font-size:14px; color:var(--ink-faint)}
.crumb:hover{color:var(--ink)}
.head{display:flex; flex-wrap:wrap; align-items:center; gap:10px 20px; margin-top:16px}
.head h1{font-size:30px; margin:0}
.head .total{margin-left:auto; font-family:Fraunces,Georgia,serif; font-size:24px; font-weight:600}
dl.pairs{display:grid; gap:16px 32px}
@media(min-width:600px){dl.pairs{grid-template-columns:1fr 1fr} dl.pairs .full{grid-column:1/-1}}
dl.pairs dt{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint)}
dl.pairs dd{margin:4px 0 0; font-size:15.5px}
.items li{border-bottom:1px solid var(--line-soft); padding:14px 0}
.items li:last-child{border-bottom:0}
.items .top-line{display:flex; align-items:flex-start; justify-content:space-between; gap:20px}
.items .q{color:var(--ink-faint)}
.items .opt{margin-top:2px; font-size:13.5px; color:var(--ink-soft)}
.items .instr{margin-top:6px; border-left:2px solid var(--gold); padding-left:12px;
  font-size:13.5px; font-style:italic; color:var(--ink-soft)}
.sums{margin-top:20px; border-top:1px solid var(--line); padding-top:14px}
.sums div{display:flex; align-items:baseline; justify-content:space-between; gap:24px; padding:5px 0}
.sums dt{font-size:14.5px; color:var(--ink-soft)}
.sums dd{margin:0; font-size:14.5px}
.sums .grand{margin-top:10px; border-top:1px solid var(--line); padding-top:14px}
.sums .grand dt{font-family:Fraunces,Georgia,serif; font-size:17px; font-weight:600; color:var(--ink)}
.sums .grand dd{font-family:Fraunces,Georgia,serif; font-size:19px; font-weight:600}
.note{margin-top:20px; border-top:1px solid var(--line-soft); padding-top:16px; font-size:15px;
  font-style:italic; color:var(--ink-soft)}
.tag{display:inline-block; border:1px solid rgba(168,126,46,.45); background:var(--cream);
  border-radius:999px; padding:6px 14px; font-size:13.5px; margin:0 8px 8px 0}
.hist li{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px; font-size:14.5px;
  padding:3px 0}
.hist .t{color:var(--ink-faint)}
.hist .by{color:var(--ink-soft)}
.hist .n2{flex-basis:100%; font-size:13.5px; color:var(--ink-soft)}

/* ---------------------------------------------------------------- actions */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0;
  border-radius:999px; padding:12px 26px; font-size:15px; transition:background-color .2s}
.btn-primary{background:var(--ink); color:var(--cream)}
.btn-primary:hover{background:rgba(59,35,16,.9)}
.btn-danger{background:var(--alert); color:var(--cream)}
.opts{display:grid; gap:10px; margin-top:16px}
@media(min-width:600px){.opts.two{grid-template-columns:1fr 1fr}}
.opt-btn{border:1px solid var(--line); background:var(--cream); border-radius:2px; padding:16px 20px;
  text-align:left; transition:border-color .2s, background-color .2s}
.opt-btn:hover{border-color:var(--gold)}
.opt-btn.on{border-color:var(--gold); background:rgba(239,226,190,.4)}
.opt-btn .t{display:block; font-family:Fraunces,Georgia,serif; font-size:16px; font-weight:600}
.opt-btn .b{display:block; margin-top:4px; font-size:14px; color:var(--ink-soft)}
.pay-btns{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px}
.pay-btns button{border:1px solid var(--line); background:var(--cream-warm); border-radius:999px;
  padding:8px 16px; font-size:14px; color:var(--ink-soft); transition:border-color .2s}
.pay-btns button:hover:not(:disabled){border-color:rgba(59,35,16,.4)}
.pay-btns button.now{border-color:var(--ink); background:var(--ink); color:var(--cream); opacity:.6;
  cursor:not-allowed}
.pay-btns button.go-paid{border-color:rgba(46,107,69,.5); background:rgba(46,107,69,.08);
  color:var(--paid)}
.pay-btns button.go-paid:hover{border-color:var(--paid)}
.waiting{margin-bottom:16px; border:1px solid rgba(166,57,28,.3); background:rgba(166,57,28,.06);
  border-radius:2px; padding:12px 16px; font-size:14.5px; line-height:1.55; color:var(--alert)}
.fine{margin-top:12px; font-size:13.5px; line-height:1.6; color:var(--ink-faint)}
.field{margin-top:16px}
.field label{display:block; margin-bottom:8px}
.field input{width:100%; border:1px solid var(--line); background:var(--cream); border-radius:2px;
  padding:10px 14px; font-size:15px}
.field input:focus{outline:none; border-color:var(--gold)}
.danger-box{border:1px solid rgba(166,57,28,.3); background:rgba(166,57,28,.05); border-radius:2px;
  padding:20px}
.danger-box h3{font-size:17px}
.link-danger{background:none; border:0; padding:0; font-size:14px; color:var(--ink-faint);
  text-decoration:underline; text-underline-offset:4px}
.link-danger:hover{color:var(--alert)}
.banner{margin-top:20px; border-radius:2px; padding:16px 20px; font-size:15px; line-height:1.6}
.banner.bad{border:1px solid rgba(166,57,28,.3); background:rgba(166,57,28,.06); color:var(--alert)}

/* ---------------------------------------------------------------- kitchen */
.cook li{border-bottom:1px solid var(--line); padding:20px 0}
.cook li:first-child{padding-top:0}
.cook li:last-child{border-bottom:0; padding-bottom:0}
.cook .line{display:flex; align-items:baseline; justify-content:space-between; gap:20px}
.cook h3{font-size:19px}
.cook .var{margin-top:2px; font-size:14.5px; color:var(--ink-soft)}
.cook .qty{font-family:Fraunces,Georgia,serif; font-size:26px; font-weight:600; white-space:nowrap}
.cook .from{margin-top:12px; display:flex; flex-wrap:wrap; gap:4px 20px; font-size:13.5px;
  color:var(--ink-faint)}
.cook .from em{color:var(--ink-soft)}
.daynav{margin-left:auto; display:flex; align-items:center; gap:18px; font-size:14.5px}
.daynav a{color:var(--ink-soft)}
.daynav a:hover{color:var(--ink)}
.daynav a.today{color:var(--gold)}
.mini{display:grid; gap:12px}
.mini a{display:block; border:1px solid var(--line); background:var(--cream); border-radius:2px;
  padding:12px 16px; transition:border-color .2s}
.mini a:hover{border-color:var(--gold)}
.mini .l1{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.mini .l1 .num{font-family:Fraunces,Georgia,serif; font-size:15px; font-weight:600}
.mini .l1 .end{margin-left:auto}
.mini .l2{margin-top:6px; font-size:14px; color:var(--ink-soft)}
.mini .l3{font-size:13px; color:var(--ink-faint)}
.mini .l4{margin-top:8px; border-left:2px solid var(--gold); padding-left:10px; font-size:13px;
  font-style:italic; color:var(--ink-soft)}
.empty{padding:24px 0; font-size:15.5px; color:var(--ink-soft)}

/* ------------------------------------------------------------------ login */
.login{max-width:420px; margin:0 auto; padding:80px 20px}
.login h1{font-size:30px}
.login form{display:grid; gap:20px; margin-top:32px}
.login label{display:block; margin-bottom:8px}
.login input{width:100%; border:1px solid var(--line); background:var(--cream-warm);
  border-radius:2px; padding:12px 16px; font-size:16px}
.login input:focus{outline:none; border-color:var(--gold)}
.creds{margin-top:32px; border:1px solid rgba(168,126,46,.45); background:rgba(239,226,190,.35);
  border-radius:2px; padding:20px}
.creds p{font-size:14.5px; line-height:1.6; color:var(--ink-soft)}
.creds code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:14px;
  color:var(--ink); background:var(--cream-warm); border:1px solid var(--line);
  border-radius:2px; padding:2px 7px}
.err{border:1px solid rgba(166,57,28,.3); background:rgba(166,57,28,.07); border-radius:2px;
  padding:12px 16px; font-size:14.5px; color:var(--alert)}
</style>

/* =====================================================================
   The Diine admin -- preview
   =====================================================================
   A faithful copy of the admin dashboard's screens and rules, running on
   sample data held in this browser. It exists so the dashboard can be used
   and judged before the site is deployed.

   The real application's authentication is NOT touched by this file and is
   not used by it. Its passwords are scrypt hashes and its sessions are
   signed cookies, both server-side; neither can run in a static page. The
   sign-in below is a stand-in for THIS preview only, which is why its
   credentials are printed on the screen.
   ===================================================================== */

var $ = function (s) { return document.querySelector(s); };
var esc = function (s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
};

/* ------------------------------------------------------------ the rules */
/* Exactly the transitions the real system allows. A pickup order is never
   sent out for delivery, and nothing comes back from delivered. */
function nextStatuses(status, fulfilment) {
  switch (status) {
    case "REQUESTED": return ["CONFIRMED"];
    case "NEW": return ["CONFIRMED"];
    case "CONFIRMED": return ["PREPARING"];
    case "PREPARING": return ["READY"];
    case "READY": return fulfilment === "PICKUP" ? ["DELIVERED"] : ["OUT_FOR_DELIVERY"];
    case "OUT_FOR_DELIVERY": return ["DELIVERED"];
    default: return [];
  }
}
var STATUS_LABELS = {
  REQUESTED: "Requested", NEW: "New", CONFIRMED: "Confirmed", PREPARING: "Preparing",
  READY: "Ready", OUT_FOR_DELIVERY: "Out for delivery", DELIVERED: "Delivered",
  CANCELLED: "Cancelled"
};
var STATUS_ACTIONS = {
  CONFIRMED: "Confirm", PREPARING: "Start preparing", READY: "Mark ready",
  OUT_FOR_DELIVERY: "Send out for delivery", DELIVERED: "Mark delivered"

var PAY_LABELS = {
  UNPAID: "Unpaid", AWAITING_VERIFICATION: "Awaiting verification", PAID: "Paid",
  REFUNDED: "Refunded"
};
var OPEN = ["REQUESTED", "NEW", "CONFIRMED", "PREPARING", "READY", "OUT_FOR_DELIVERY"];

/* Free window: 24 hours for a normal order, 48 for an event. Outside it a
   20% charge is CALCULATED AND RECORDED -- never collected. */
function cancellationTerms(o) {
  var freeHours = o.type === "EVENT" ? 48 : 24;
  var hoursUntil = (new Date(o.date + "T00:00:00").getTime() - Date.now()) / 3600000;
  var within = hoursUntil >= freeHours;
  return { freeHours: freeHours, within: within, percent: 20,
           charge: within ? 0 : Math.round(o.total * 0.2) };
}

var KEY = "thediine.admin.preview.v1";
var S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S || !S.orders) S = freshData();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ----------------------------------------------------------- formatting */
function egp(piastres) {
  var pounds = piastres / 100;
  var hasFraction = piastres % 100 !== 0;
  return pounds.toLocaleString("en-EG", {
    minimumFractionDigits: hasFraction ? 2 : 0, maximumFractionDigits: 2
  }) + " EGP";
}
function total(o) { return o.items.reduce(function (n, i) { return n + i.unit * i.qty; }, 0); }
function longDate(d) {
  var x = new Date(d + "T00:00:00");
  return x.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short",
    year: "numeric" });
}
function fullDate(d) {
  var x = new Date(d + "T00:00:00");
  return x.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long",
    year: "numeric" });
}
function byNumber(n) {
  for (var i = 0; i < S.orders.length; i++) if (S.orders[i].number === n) return S.orders[i];
  return null;
}
function statusPill(s) {
  return '<span class="pill st-' + s + '">' + STATUS_LABELS[s] + "</span>";
}
function payPill(s) {
  return '<span class="pill pay-' + s + '">' + PAY_LABELS[s] + "</span>";
}
function typePill(t) {
  return '<span class="type' + (t === "EVENT" ? " ev" : "") + '">'
    + (t === "EVENT" ? "Event" : "Order") + "</span>";
}
function methodLabel(o) {
  if (o.method === "CASH") return o.fulfilment === "PICKUP" ? "Payment on pickup" : "Cash on delivery";
  return o.method === "INSTAPAY" ? "InstaPay" : "Card";
}

/* --------------------------------------------------------------- routing */
function hash() { return (location.hash.replace(/^#/, "").split("?")[0]) || "/"; }
function query() {
  var q = location.hash.split("?")[1] || "";
  return new URLSearchParams(q);
}
function go(h) { location.hash = h; }

/* ----------------------------------------------------------------- today */
function attention() {
  var a = { events: 0, payments: 0, fresh: 0 };
  S.orders.forEach(function (o) {
    if (o.type === "EVENT" && o.status === "REQUESTED") a.events++;
    if (o.payment === "AWAITING_VERIFICATION") a.payments++;
    if (o.type === "NORMAL" && o.status === "NEW") a.fresh++;
  });
  return a;
}
function viewToday() {
  var a = attention();
  var today = iso(0);
  var due = S.orders.filter(function (o) { return o.date === today && o.status !== "CANCELLED"; });

  return "<main>"
    + '<p class="eyebrow">Today</p>'
    + "<h1>Good to see you, " + esc(S.admin.name.split(" ")[0]) + "</h1>"
    + '<div class="stats">'
    + stat("Event requests waiting", a.events, "#/orders?status=REQUESTED")
    + stat("Payments to verify", a.payments, "#/orders?payment=AWAITING_VERIFICATION")
    + stat("New orders to confirm", a.fresh, "#/orders?status=NEW")
    + "</div>"
    + '<div style="margin-top:40px"><section class="card">'
    + "<header><h2>Going out today</h2>"
    + '<a href="#/kitchen?date=' + today + '" style="color:var(--gold);font-size:14px">'

        ? '<div class="body"><p class="empty" style="padding:0">Nothing is due today.</p></div>'

}
function stat(label, n, href) {
  return '<a class="stat' + (n > 0 ? " alert" : "") + '" href="' + href + '">'

function orderRow(o) {

/* ---------------------------------------------------------------- orders */
function viewOrders() {
  var q = query();
  var fType = q.get("type"), fStatus = q.get("status"), fPay = q.get("payment");
  var search = (q.get("q") || "").trim().toLowerCase();
  var all = q.get("all") === "1";

  var list = S.orders.filter(function (o) {
    if (fType && o.type !== fType) return false;
    if (fStatus && o.status !== fStatus) return false;
    if (fPay && o.payment !== fPay) return false;
    if (!all && !fStatus && !fPay && OPEN.indexOf(o.status) < 0) return false;
    if (search) {
      var hay = (o.number + " " + o.name + " " + o.mobile).toLowerCase();
      if (hay.indexOf(search) < 0) return false;
    }
    return true;
  }).sort(function (a, b) { return a.date < b.date ? -1 : 1; });

  var open = !fType && !fStatus && !fPay && !all;
  var chip = function (href, on, label) {
    return '<a class="chip' + (on ? " on" : "") + '" href="' + href + '">' + label + "</a>";
  };

  return "<main>"
    + '<p class="eyebrow">Orders</p>'
    + "<h1>" + (open ? "Open orders" : "Orders") + "</h1>"
    + '<div class="chips">'
    + chip("#/orders", open, "Open")
    + chip("#/orders?all=1", all, "All")
    + chip("#/orders?type=NORMAL", fType === "NORMAL", "Normal")
    + chip("#/orders?type=EVENT", fType === "EVENT", "Events")
    + chip("#/orders?status=REQUESTED", fStatus === "REQUESTED", "Requests")
    + chip("#/orders?payment=AWAITING_VERIFICATION", fPay === "AWAITING_VERIFICATION", "To verify")
    + '<form class="search" id="search-form">'
    + '<input type="search" id="q" value="' + esc(q.get("q") || "")
    + '" placeholder="Number, name or mobile">'
    + '<button type="submit" style="background:none;border:0;color:var(--gold);font-size:14px">'
    + "Search</button></form>"
    + "</div>"
    + '<div style="margin-top:24px"><section class="card">'
    + (list.length === 0
        ? '<div class="body"><p class="empty" style="padding:0;text-align:center">'
          + "Nothing matches that.</p></div>"
        : '<ul class="rows">' + list.map(orderRow).join("") + "</ul>")
    + "</section></div>"
    + '<p class="fine">' + list.length + " shown.</p></main>";
}

/* ----------------------------------------------------------------- order */

  var o = byNumber(number);
  if (!o) return '<main><p class="empty">That order is not in the sample data.</p></main>';

  var isEvent = o.type === "EVENT";
  var t = total(o);
  var terms = cancellationTerms(Object.assign({}, o, { total: t }));
  var finished = o.status === "DELIVERED" || o.status === "CANCELLED";

  var rows = "";
  if (isEvent) rows += pair("Occasion", esc(o.occasion));
  rows += pair(isEvent ? "Date" : "Wanted for", longDate(o.date));
  rows += pair("Time", o.time);
  if (isEvent) rows += pair("Guests", String(o.guests));
  else rows += pair("Fulfilment", o.fulfilment === "PICKUP" ? "Pickup" : "Delivery");
  rows += pair("Serving setup", o.setup === "RETURNABLE" ? "Returnable dishes" : "Disposable dishes");
  if (o.address) {
    rows += pair(isEvent ? "Venue" : "Address",
      esc(o.details ? o.address + " \u2014 " + o.details : o.address), true);
  }
  rows += pair("Placed", esc(o.placed));

  return "<main>"
    + '<a class="crumb" href="#/orders">\u2190 All orders</a>'
    + '<div class="head"><h1 class="tnum">' + o.number + "</h1>"
    + typePill(o.type) + statusPill(o.status) + payPill(o.payment)
    + '<span class="total tnum">' + egp(t) + "</span></div>"
    + (o.status === "CANCELLED"
        ? '<div class="banner bad">Cancelled \u2014 ' + esc(o.cancelReason || "no reason given") + ". "
          + (o.cancelWithin
              ? "Inside the free window, so nothing was charged."
              : "A late-cancellation charge of " + egp(o.cancelCharge)
                + " was recorded (not collected).")
          + "</div>"
        : "")
    + '<div class="grid cols" style="margin-top:32px">'

    + "<div class=\"grid\">"
    + card(isEvent ? "The event" : "The order",
        '<dl class="pairs">' + rows + "</dl>"
        + (o.notes ? '<p class="note">\u201c' + esc(o.notes) + "\u201d</p>" : ""))
    + card("Customer",
        '<dl class="pairs">' + pair("Name", esc(o.name))
        + pair("Mobile", '<a href="https://wa.me/2' + esc(o.mobile.replace(/^0/, ""))
            + '" target="_blank" rel="noreferrer" style="color:var(--gold)">'
            + esc(o.mobile) + " \u2192 WhatsApp</a>")
        + (o.email ? pair("Email", esc(o.email)) : "") + "</dl>")
    + card(isEvent ? "Dishes for the event" : "Dishes",
        '<ul class="items">' + o.items.map(function (i) {
          return "<li>"
            + '<div class="top-line"><div style="min-width:0">'
            + '<p style="font-size:15.5px"><span class="q tnum">' + i.qty + "\u00d7</span> "

            + (i.instr ? '<p class="instr">' + esc(i.instr) + "</p>" : "")
            + "</div>"
            + '<p class="tnum" style="white-space:nowrap;font-size:15px">'
            + egp(i.unit * i.qty) + "</p></div></li>";
        }).join("") + "</ul>"
        + '<dl class="sums">'
        + '<div><dt>' + (isEvent ? "Food subtotal" : "Subtotal") + "</dt><dd class=\"tnum\">"
        + egp(t) + "</dd></div>"
        + (!isEvent && o.fulfilment === "DELIVERY"
            ? "<div><dt>Delivery</dt><dd>Not set \u2014 confirm with the customer</dd></div>" : "")
        + '<div class="grand"><dt>Total</dt><dd class="tnum">' + egp(t) + "</dd></div></dl>"
        + (isEvent
            ? '<p class="fine">Priced for ' + o.guests + " guests at " + o.multiplier
              + " the regular menu price.</p>" : ""))
    + (isEvent
        ? card("Anything else for the day?",
            (o.extras && o.extras.length
              ? o.extras.map(function (x) { return '<span class="tag">' + x + "</span>"; }).join("")
              : '<p style="font-size:15px;color:var(--ink-soft)">Nothing requested.</p>')

          return "<li><span class=\"t\">" + esc(h.t) + "</span>"

        }).join("") + "</ol>")

            + 'id="confirm-event">Confirm this event</button>')
        : card("Order status",
            '<p style="font-size:14.5px;color:var(--ink-soft)">Now: <strong>'
            + STATUS_LABELS[o.status] + "</strong></p>"
            + (nextStatuses(o.status, o.fulfilment).length === 0
                ? '<p class="fine">This order has reached the end of its journey.</p>'
                : '<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:16px">'
                  + nextStatuses(o.status, o.fulfilment).map(function (s) {
                      return '<button type="button" class="btn btn-primary" data-to="' + s + '">'
                        + STATUS_ACTIONS[s] + "</button>";
                    }).join("") + "</div>")))
    + card("Payment",
        '<p style="font-size:14.5px;color:var(--ink-soft)">' + methodLabel(o) + "</p>"
        + (o.payment === "AWAITING_VERIFICATION"
            ? '<p class="waiting" style="margin-top:16px">Waiting on you: check that ' + egp(t)
              + " arrived before marking this paid.</p>"
            : "")
        + '<div class="field"><label class="lab" for="ref">Transfer reference '
        + '<span style="text-transform:none;letter-spacing:normal">optional</span></label>'
        + '<input type="text" id="ref" value="' + esc(o.reference || "") + '"></div>'
        + '<div class="pay-btns">'
        + ["UNPAID", "AWAITING_VERIFICATION", "PAID", "REFUNDED"].map(function (s) {
            var now = s === o.payment;
            return '<button type="button" data-pay="' + s + '"' + (now ? " disabled" : "")
              + ' class="' + (now ? "now" : s === "PAID" ? "go-paid" : "") + '">'
              + (now ? PAY_LABELS[s] + " \u2014 now" : "Mark " + PAY_LABELS[s].toLowerCase())
              + "</button>";
          }).join("") + "</div>"
        + '<p class="fine">This changes the payment only. The order stays exactly where it is.</p>')
    + (finished ? "" :
        '<div><div id="cancel-slot">'
        + '<button type="button" class="link-danger" id="open-cancel">Cancel this order</button>'
        + "</div></div>")
    + "</div></div></main>";
}
function card(title, body) {
  return '<section class="card"><header><h2>' + title + '</h2></header>'
    + '<div class="body">' + body + "</div></section>";
}
function pair(label, value, full) {
  return "<div" + (full ? ' class="full"' : "") + "><dt>" + label + "</dt><dd>" + value + "</dd></div>";
}
function cancelBox(o) {
  var t = total(o);
  var terms = cancellationTerms(Object.assign({}, o, { total: t }));
  return '<div class="danger-box"><h3>Cancel this order</h3>'
    + '<p style="margin-top:8px;font-size:14.5px;color:var(--ink-soft)">'

          + "does not collect it.")
    + "</p>"
    + '<div class="field"><label class="lab" for="reason">Reason</label>'
    + '<input type="text" id="reason" placeholder="Why is it being cancelled?"></div>'

    + '<button type="button" class="link-danger" id="keep">Keep it</button></div></div>';
}

/* --------------------------------------------------------------- kitchen */
function prepFor(date) {
  var lines = {};
  S.orders.forEach(function (o) {
    if (o.date !== date) return;
    if (["CONFIRMED", "PREPARING", "READY", "OUT_FOR_DELIVERY"].indexOf(o.status) < 0) return;
    o.items.forEach(function (i) {
      var key = i.name;
      if (!lines[key]) lines[key] = { name: i.name, qty: 0, from: [] };
      lines[key].qty += i.qty;
      lines[key].from.push({ number: o.number, qty: i.qty, instr: i.instr });
    });
  });
  return Object.keys(lines).sort().map(function (k) { return lines[k]; });
}
function viewKitchen() {
  var date = query().get("date") || iso(0);
  var lines = prepFor(date);
  var orders = S.orders.filter(function (o) {
    return o.date === date && o.status !== "CANCELLED";
  });
  var count = lines.reduce(function (n, l) { return n + l.qty; }, 0);
  var shift = function (days) {
    var d = new Date(date + "T00:00:00");
    d.setDate(d.getDate() + days);
    return "#/kitchen?date=" + d.toISOString().slice(0, 10);
  };

  return "<main>"
    + '<p class="eyebrow">Kitchen</p>'
    + '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-top:12px">'
    + "<h1 style=\"margin:0\">" + fullDate(date) + "</h1>"
    + '<span class="daynav"><a href="' + shift(-1) + '">\u2190 Day before</a>'
    + '<a class="today" href="#/kitchen?date=' + iso(0) + '">Today</a>'
    + '<a href="' + shift(1) + '">Day after \u2192</a></span></div>'
    + '<p class="sub">' + (lines.length === 0
        ? "Nothing confirmed to cook."
        : lines.length + (lines.length === 1 ? " dish, " : " dishes, ") + count
          + " in total, across " + orders.length + (orders.length === 1 ? " order." : " orders."))
    + "</p>"
    + '<div class="grid k-cols" style="margin-top:32px">'
    + card("To cook", lines.length === 0
        ? '<p class="empty" style="padding:0">Nothing to cook for this day. Only confirmed orders '
          + "appear here \u2014 an event request that has not been accepted is not counted.</p>"
        : '<ul class="cook">' + lines.map(function (l) {
            return "<li><div class=\"line\"><div><h3>" + esc(l.name) + "</h3></div>"
              + '<p class="qty tnum">\u00d7' + l.qty + "</p></div>"
              + '<ul class="from">' + l.from.map(function (f) {
                  return "<li><span class=\"tnum\">" + f.number + "</span> "
                    + '<span class="tnum">\u00d7' + f.qty + "</span>"
                    + (f.instr ? " <em>\u201c" + esc(f.instr) + "\u201d</em>" : "") + "</li>";
                }).join("") + "</ul></li>";
          }).join("") + "</ul>")
    + card("Orders that day", orders.length === 0
        ? '<p style="font-size:15px;color:var(--ink-soft)">None.</p>'
        : '<div class="mini">' + orders.map(function (o) {
            return '<a href="#/order/' + o.number + '">'
              + '<span class="l1"><span class="num">' + o.number + "</span>" + typePill(o.type)
              + '<span class="end">' + statusPill(o.status) + "</span></span>"
              + '<span class="l2">' + esc(o.name) + " \u00b7 " + o.time + "</span>"
              + '<span class="l3">' + (o.type === "EVENT" ? o.guests + " guests"
                  : o.fulfilment === "PICKUP" ? "Pickup" : "Delivery") + "</span>"
              + (o.notes ? '<span class="l4">' + esc(o.notes) + "</span>" : "")
              + "</a>";
          }).join("") + "</div>")
    + "</div></main>";
}

function chrome(inner) {

    + '<button type="button" id="signout">Sign out</button></div>'

/* --------------------------------------------------------------- render */
var LOGIN_ERROR = null;
function render() {
  var h = hash();
  if (!S.signedIn) {
    $("#app").innerHTML = viewLogin(LOGIN_ERROR);
    LOGIN_ERROR = null;
    return;
  }
  var body;
  if (h.indexOf("/order/") === 0) body = viewOrder(decodeURIComponent(h.slice(7)));
  else if (h === "/orders") body = viewOrders();
  else if (h === "/kitchen") body = viewKitchen();
  else body = viewToday();
  $("#app").innerHTML = chrome(body);
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);

/* ---------------------------------------------------------------- events */
document.addEventListener("submit", function (e) {
  if (e.target.id === "login-form") {
    e.preventDefault();
    var email = $("#email").value.trim().toLowerCase();
    var pw = $("#password").value;
    /* The same message either way, exactly as the real sign-in behaves: the
       form cannot be used to find out which accounts exist. */
    if (email === "radwaserag@hotmail.com" && pw === "thediine-preview") {
      S.signedIn = true; save(); go("#/"); render();
    } else {
      LOGIN_ERROR = "That email and password do not match.";
      render();
    }
    return;
  }
  if (e.target.id === "search-form") {
    e.preventDefault();
    var q = $("#q").value.trim();
    go("#/orders" + (q ? "?q=" + encodeURIComponent(q) : ""));
  }
});

document.addEventListener("click", function (e) {
  var t = e.target.closest("button");
  if (!t) return;

  if (t.id === "reset") {
    /* Puts the sample orders back without signing you out -- resetting the
       data is not the same act as leaving. */
    var wasIn = S.signedIn;
    S = freshData();
    S.signedIn = wasIn;
    save(); go("#/"); render(); return;
  }
  if (t.id === "signout") { S.signedIn = false; save(); render(); return; }

  var order = byNumber(decodeURIComponent(hash().slice(7)));

  /* choosing what confirming an event does to the day */
  if (t.dataset.mode) {
    document.querySelectorAll("[data-mode]").forEach(function (b) {
      b.classList.toggle("on", b === t);
    });
    return;
  }
  if (t.id === "confirm-event" && order) {
    var chosen = document.querySelector("[data-mode].on");
    var mode = chosen ? chosen.dataset.mode : "BLOCK_DAY";
    order.status = "CONFIRMED";
    order.capacityMode = mode;
    order.history.push({ t: "Just now", to: "CONFIRMED", by: S.admin.name,
      note: mode === "BLOCK_DAY" ? "Confirmed; the day is blocked." : "Confirmed; the day stays open." });
    if (mode === "BLOCK_DAY" && S.blockedDays.indexOf(order.date) < 0) S.blockedDays.push(order.date);
    save(); render(); return;
  }

  /* moving the order along */
  if (t.dataset.to && order) {
    order.history.push({ t: "Just now", to: t.dataset.to, by: S.admin.name });
    order.status = t.dataset.to;
    save(); render(); return;
  }

  /* the payment, on its own */
  if (t.dataset.pay && order) {
    order.payment = t.dataset.pay;
    var ref = $("#ref");
    if (ref && ref.value.trim()) order.reference = ref.value.trim();
    save(); render(); return;
  }

  /* cancelling */
  if (t.id === "open-cancel" && order) {
    $("#cancel-slot").innerHTML = cancelBox(order);
    return;
  }
  if (t.id === "keep" && order) {
    $("#cancel-slot").innerHTML =
      '<button type="button" class="link-danger" id="open-cancel">Cancel this order</button>';
    return;
  }
  if (t.id === "do-cancel" && order) {
    var terms = cancellationTerms(Object.assign({}, order, { total: total(order) }));
    var reason = $("#reason") ? $("#reason").value.trim() : "";
    order.status = "CANCELLED";
    order.cancelReason = reason;
    order.cancelWithin = terms.within;
    order.cancelCharge = terms.charge;
    order.history.push({ t: "Just now", to: "CANCELLED", by: S.admin.name,
      note: terms.within ? "Cancelled inside the free window."
                         : "Cancelled late \u2014 " + terms.percent + "% recorded." });
    var i = S.blockedDays.indexOf(order.date);
    if (i >= 0) S.blockedDays.splice(i, 1);
    save(); render(); return;
  }
});

render();
</script>
