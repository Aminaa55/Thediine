<title>The Diine Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;700&display=swap">

<style>
/* The Diine admin, in the brand's own system: three creams, a brown ink, gold
   as the accent. Semantic colour is separate from the accent and used only for
   state -- a payment that needs checking, a payment that has landed.
   Single-theme by design, like the site: every colour painted explicitly so the
   page holds whatever ground it is dropped on. */
:root{
  --cream:#FBF1E4; --cream-warm:#FFFAF3; --cream-deep:#F4E5CE; --cream-toast:#EBD7B4;
  --ink:#3B2310; --ink-soft:#6E523A; --ink-faint:#9A7E62;
  --gold:#A87E2E; --gold-pale:#EFE2BE;
  --line:#E4CFAF; --line-soft:#EFE0C8;
  --alert:#A6391C; --paid:#2E6B45;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--cream); color:var(--ink);
  font-family:Karla,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Fraunces,Georgia,serif; font-weight:600; margin:0; line-height:1.2;
  text-wrap:balance}
p{margin:0}
ul,ol{margin:0; padding:0; list-style:none}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
a{color:inherit; text-decoration:none}
:focus-visible{outline:2px solid var(--gold); outline-offset:3px; border-radius:2px}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

/* ------------------------------------------------------------- the banner */
.demo{background:var(--ink); color:var(--cream); font-size:13.5px; line-height:1.5}
.demo .in{max-width:1180px; margin:0 auto; padding:10px 20px; display:flex; flex-wrap:wrap;
  align-items:center; gap:8px 20px}
.demo strong{color:#F0D9A6; font-weight:700}
.demo button{margin-left:auto; background:none; border:1px solid rgba(251,241,228,.35);
  color:var(--cream); border-radius:999px; padding:4px 14px; font-size:12.5px}
.demo button:hover{border-color:var(--cream)}

/* -------------------------------------------------------------- the chrome */
.top{border-bottom:1px solid var(--line); background:var(--cream-warm)}
.top .in{max-width:1180px; margin:0 auto; padding:14px 20px; display:flex; flex-wrap:wrap;
  align-items:center; gap:10px 28px}
.brand{font-family:Fraunces,Georgia,serif; font-size:19px; font-weight:600}
.brand .tag{margin-left:8px; border:1px solid rgba(168,126,46,.45); border-radius:999px;
  padding:2px 9px; font-family:Karla,sans-serif; font-size:10px; font-weight:700;
  letter-spacing:.18em; text-transform:uppercase; color:var(--gold)}
/* Built to hold Menu, Settings and Analytics as well: it scrolls rather than
   wraps, and the current section is marked by a rule, not by position. */
.top nav{display:flex; gap:4px; margin:0 -4px; overflow-x:auto; scrollbar-width:none}
.top nav::-webkit-scrollbar{display:none}
.top nav a{white-space:nowrap; padding:6px 12px; font-size:15px; color:var(--ink-soft);
  border-bottom:2px solid transparent; transition:color .2s, border-color .2s}
.top nav a:hover{color:var(--ink); border-bottom-color:var(--line)}
.top nav a.on{color:var(--ink); font-weight:700; border-bottom-color:var(--gold)}
.who{margin-left:auto; display:flex; align-items:center; gap:20px; font-size:14px;
  color:var(--ink-soft)}
.who button{background:none; border:0; padding:0; font-size:14px; color:var(--ink-faint);
  text-decoration:underline; text-underline-offset:4px}
.who button:hover{color:var(--ink)}
main{max-width:1180px; margin:0 auto; padding:36px 20px 72px}

/* ------------------------------------------------------------------- type */
.eyebrow{font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold)}
.lab{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint)}
h1{font-size:30px}
.sub{margin-top:12px; font-size:15.5px; color:var(--ink-soft)}
.page-head{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between;
  gap:8px 32px}
.page-head .when{font-size:15px; color:var(--ink-soft)}

/* ------------------------------------------------------------------ cards */
.card{border:1px solid var(--line); background:var(--cream-warm); border-radius:2px}
.card > header{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between;
  gap:16px; border-bottom:1px solid var(--line); padding:16px 24px}
.card > header h2{font-size:18px}
.card > header a{font-size:14px; color:var(--gold)}
.card > header a:hover{text-decoration:underline}
.card > .body{padding:20px 24px}
.grid{display:grid; gap:24px}
@media(min-width:1000px){
  .two-up{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); align-items:start}
  .cols{grid-template-columns:minmax(0,1fr) 380px; align-items:start}
  .cols > .side{position:sticky; top:24px}
  .k-cols{grid-template-columns:minmax(0,1fr) 310px; align-items:start}
  .k-cols > .side{position:sticky; top:24px}
}

/* ------------------------------------------------------------------ stats */
.stats{display:grid; gap:16px; margin-top:28px}
@media(min-width:700px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{display:block; border:1px solid var(--line); background:var(--cream-warm);
  border-radius:2px; padding:20px; transition:border-color .2s}
.stat:hover{border-color:var(--gold)}
.stat .n{margin-top:8px; font-family:Fraunces,Georgia,serif; font-size:28px; font-weight:600;
  display:block}
.stat.alert{border-color:rgba(166,57,28,.35); background:rgba(166,57,28,.06)}
.stat.alert:hover{border-color:rgba(166,57,28,.6)}
.stat.alert .n{color:var(--alert)}

/* ------------------------------------------------------------------ pills */
.pill{display:inline-block; white-space:nowrap; border:1px solid; border-radius:999px;
  padding:3px 12px; font-size:12.5px}
.st-REQUESTED{border-color:rgba(168,126,46,.5); background:rgba(239,226,190,.5); color:var(--ink)}
.st-NEW{border-color:rgba(59,35,16,.25); background:var(--cream-deep); color:var(--ink)}
.st-CONFIRMED{border-color:var(--ink); background:var(--ink); color:var(--cream)}
.st-PREPARING,.st-READY,.st-OUT_FOR_DELIVERY{border-color:var(--gold);
  background:rgba(168,126,46,.22); color:var(--ink)}
.st-DELIVERED{border-color:var(--line); background:var(--cream); color:var(--ink-faint)}
.st-CANCELLED{border-color:rgba(166,57,28,.35); background:rgba(166,57,28,.08); color:var(--alert)}
.pay-UNPAID{border-color:var(--line); background:var(--cream); color:var(--ink-soft)}
.pay-AWAITING_VERIFICATION{border-color:rgba(166,57,28,.35); background:rgba(166,57,28,.07);
  color:var(--alert)}
.pay-PAID{border-color:rgba(46,107,69,.35); background:rgba(46,107,69,.08); color:var(--paid)}
.pay-REFUNDED{border-color:var(--line); background:var(--cream); color:var(--ink-faint)}
.type{display:inline-block; white-space:nowrap; border:1px solid var(--line); border-radius:999px;
  padding:1px 10px; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-faint)}
.type.ev{border-color:rgba(168,126,46,.5); color:var(--gold)}

/* ------------------------------------------------------------- today rows */
.today-list li{border-bottom:1px solid var(--line-soft)}
.today-list li:last-child{border-bottom:0}
.today-list a{display:block; margin:0 -12px; padding:14px 12px; border-radius:2px;
  transition:background-color .15s}
.today-list a:hover{background:var(--cream)}
.today-list .l1{display:flex; align-items:baseline; gap:12px}
.today-list .num{font-family:Fraunces,Georgia,serif; font-size:16px; font-weight:600}
.today-list .name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:15px}
.today-list .amt{margin-left:auto; white-space:nowrap; font-family:Fraunces,Georgia,serif;
  font-size:15.5px; font-weight:600}
.today-list .l2{margin-top:6px; display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px}
.today-list .meta{font-size:13.5px; color:var(--ink-faint)}
.today-list .pills{margin-left:auto; display:flex; gap:8px}
.ev-list li{border-bottom:1px solid var(--line-soft)}
.ev-list li:last-child{border-bottom:0}
.ev-list a{display:block; margin:0 -12px; padding:14px 12px; border-radius:2px;
  transition:background-color .15s}
.ev-list a:hover{background:var(--cream)}
.ev-list .l1{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 12px}
.ev-list .occ{font-family:Fraunces,Georgia,serif; font-size:16px; font-weight:600}
.ev-list .guests{font-size:14px; color:var(--ink-soft)}
.ev-list .l1 .end{margin-left:auto}
.ev-list .l2{margin-top:4px; display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px;
  font-size:13.5px; color:var(--ink-faint)}
.ev-list .l2 .away{color:var(--ink-soft)}
.ev-list .l2 .num{margin-left:auto}
.ev-list .l3{margin-top:2px; font-size:13.5px; color:var(--ink-soft)}

/* ------------------------------------------------------------------- rows */
.rows{border-top:1px solid var(--line-soft)}
.rows li{border-bottom:1px solid var(--line-soft)}
.row{display:flex; flex-wrap:wrap; align-items:center; gap:8px 20px; padding:16px 24px;
  transition:background-color .15s}
a.row:hover{background:var(--cream)}
.row .num{font-family:Fraunces,Georgia,serif; font-size:16px; font-weight:600}
.row .name{font-size:15px}
.row .mob{font-size:13.5px; color:var(--ink-faint)}
.row .when{font-size:14px; color:var(--ink-soft)}
.row .when span{display:block; font-size:13px; color:var(--ink-faint)}
.row .end{margin-left:auto; display:flex; flex-wrap:wrap; align-items:center; gap:12px}
.row .amt{font-family:Fraunces,Georgia,serif; font-size:15.5px; font-weight:600}

/* ---------------------------------------------------------------- filters */
.filters{display:grid; gap:14px; margin-top:26px}
.chips{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.chip{border:1px solid var(--line); background:var(--cream-warm); border-radius:999px;
  padding:6px 16px; font-size:14px; color:var(--ink-soft); transition:border-color .2s}
.chip:hover{border-color:rgba(59,35,16,.4)}
.chip.on{border-color:var(--ink); background:var(--ink); color:var(--cream)}
.chip.sm{padding:4px 14px; font-size:13.5px}
.chip-div{width:1px; height:20px; background:var(--line); margin:0 4px}
.search{margin-left:auto; display:flex; align-items:center; gap:10px}
.search input{width:230px; border:1px solid var(--line); background:var(--cream-warm);
  border-radius:999px; padding:7px 16px; font-size:14.5px}
.search input:focus{outline:none; border-color:var(--gold)}
.search button{background:none; border:0; padding:0; font-size:14px; color:var(--gold)}
.daterow{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px;
  border:1px solid var(--line); background:var(--cream-warm); border-radius:2px; padding:12px 16px}
.daterow input[type=date]{border:1px solid var(--line); background:var(--cream); border-radius:2px;
  padding:5px 12px; font-size:14px}
.daterow input[type=date]:focus{outline:none; border-color:var(--gold)}
.daterow label{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-faint)}
.clear{font-size:13.5px; color:var(--ink-faint); text-decoration:underline;
  text-underline-offset:4px; background:none; border:0; padding:0}
.clear:hover{color:var(--ink)}
.count{font-size:13.5px; color:var(--ink-faint)}
.count a{color:var(--gold)}
.count a:hover{text-decoration:underline}

/* ------------------------------------------------------------- order page */
.crumb{font-size:14px; color:var(--ink-faint)}
.crumb:hover{color:var(--ink)}
.head{display:flex; flex-wrap:wrap; align-items:center; gap:10px 20px; margin-top:16px}
.head h1{font-size:30px}
.head .total{margin-left:auto; font-family:Fraunces,Georgia,serif; font-size:24px; font-weight:600}
/* The thing most easily missed, given the weight to match. */
.notes-banner{margin-top:24px; border:1px solid var(--gold); background:rgba(239,226,190,.45);
  border-radius:2px; padding:20px 24px}
.notes-banner .lab2{font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold)}
.notes-banner p{margin-top:12px; font-size:16.5px; line-height:1.6}
.notes-banner li{margin-top:6px; font-size:15.5px; line-height:1.6}
.notes-banner li strong{font-weight:700}
dl.pairs{display:grid; gap:16px 32px}
@media(min-width:600px){dl.pairs{grid-template-columns:1fr 1fr} dl.pairs .full{grid-column:1/-1}}
dl.pairs dt{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint)}
dl.pairs dd{margin:4px 0 0; font-size:15.5px}
.wa{margin-top:20px; display:inline-flex; align-items:center; gap:10px;
  border:1px solid var(--paid); background:rgba(46,107,69,.08); border-radius:999px;
  padding:10px 20px; font-size:15px; color:var(--paid); transition:background-color .2s}
.wa:hover{background:rgba(46,107,69,.16)}
.addr{font-family:Fraunces,Georgia,serif; font-size:19px; line-height:1.35}
.addr-more{margin-top:6px; font-size:15.5px; color:var(--ink-soft)}
.addr-area{margin-top:8px; font-size:14px; color:var(--ink-faint)}
.addr-acts{margin-top:16px; display:flex; flex-wrap:wrap; gap:12px}
.addr-acts button,.addr-acts a{border:1px solid var(--line); background:var(--cream);
  border-radius:999px; padding:4px 14px; font-size:13px; color:var(--ink-soft);
  transition:border-color .2s, color .2s}
.addr-acts button:hover,.addr-acts a:hover{border-color:var(--gold); color:var(--ink)}
.items li{border-bottom:1px solid var(--line-soft); padding:14px 0}
.items li:last-child{border-bottom:0}
.items .top-line{display:flex; align-items:flex-start; justify-content:space-between; gap:20px}
.items .q{color:var(--ink-faint)}
.items .instr{margin-top:6px; border-left:2px solid var(--gold); padding-left:12px;
  font-size:13.5px; font-style:italic; color:var(--ink-soft)}
.sums{margin-top:20px; border-top:1px solid var(--line); padding-top:14px}
.sums div{display:flex; align-items:baseline; justify-content:space-between; gap:24px; padding:5px 0}
.sums dt{font-size:14.5px; color:var(--ink-soft)}
.sums dd{margin:0; font-size:14.5px}
.sums .grand{margin-top:10px; border-top:1px solid var(--line); padding-top:14px}
.sums .grand dt{font-family:Fraunces,Georgia,serif; font-size:17px; font-weight:600; color:var(--ink)}
.sums .grand dd{font-family:Fraunces,Georgia,serif; font-size:19px; font-weight:600}
.note{margin-top:20px; border-top:1px solid var(--line-soft); padding-top:16px; font-size:15px;
  font-style:italic; color:var(--ink-soft)}
.tag{display:inline-block; border:1px solid rgba(168,126,46,.45); background:var(--cream);
  border-radius:999px; padding:6px 14px; font-size:13.5px; margin:0 8px 8px 0}
/* History as a line you can follow. */
.timeline{position:relative; margin-left:8px; border-left:1px solid var(--line)}
.timeline li{position:relative; padding:0 0 20px 24px}
.timeline li:last-child{padding-bottom:0}
.timeline .dot{position:absolute; left:-5.5px; top:6px; width:10px; height:10px; border-radius:999px;
  border:1px solid var(--line); background:var(--cream-warm)}
.timeline li.last .dot{border-color:var(--gold); background:var(--gold)}
.timeline .what{font-family:Fraunces,Georgia,serif; font-size:16px; font-weight:600}
.timeline .from{margin-left:8px; font-family:Karla,sans-serif; font-size:13.5px; font-weight:400;
  color:var(--ink-faint)}
.timeline .meta{margin-top:2px; font-size:13.5px; color:var(--ink-soft)}
.timeline .n2{margin-top:4px; font-size:14px; color:var(--ink-soft)}

/* ---------------------------------------------------------------- actions */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0;
  border-radius:999px; padding:12px 26px; font-size:15px; transition:background-color .2s}
.btn-primary{background:var(--ink); color:var(--cream)}
.btn-primary:hover{background:rgba(59,35,16,.9)}
.btn-danger{background:var(--alert); color:var(--cream)}
/* One obvious next step per panel. */
.btn-main{width:100%; padding:15px 26px; font-size:16px}
.btn-paid{width:100%; border:1px solid var(--paid); background:var(--paid); color:var(--cream);
  border-radius:999px; padding:15px 26px; font-size:16px; transition:background-color .2s}
.btn-paid:hover{background:#255739}
.btn-second{width:100%; margin-top:12px; border:1px solid var(--line); background:var(--cream);
  border-radius:999px; padding:10px 20px; font-size:14.5px; color:var(--ink-soft)}
.btn-second:hover{border-color:rgba(59,35,16,.4)}
.opts{display:grid; gap:10px; margin-top:16px}
.opt-btn{border:1px solid var(--line); background:var(--cream); border-radius:2px; padding:14px 20px;
  text-align:left; transition:border-color .2s, background-color .2s}
.opt-btn:hover{border-color:var(--gold)}
.opt-btn.on{border-color:var(--gold); background:rgba(239,226,190,.4)}
.opt-btn .t{display:block; font-family:Fraunces,Georgia,serif; font-size:16px; font-weight:600}
.opt-btn .b{display:block; margin-top:4px; font-size:14px; color:var(--ink-soft)}
.waiting{border:1px solid rgba(166,57,28,.3); background:rgba(166,57,28,.06); border-radius:2px;
  padding:12px 16px; font-size:14.5px; line-height:1.55; color:var(--alert); margin-bottom:16px}
.fine{margin-top:12px; font-size:13.5px; line-height:1.6; color:var(--ink-faint)}
.field{margin-top:16px}
.field label{display:block; margin-bottom:8px}
.field input{width:100%; border:1px solid var(--line); background:var(--cream); border-radius:2px;
  padding:10px 14px; font-size:15px}
.field input:focus{outline:none; border-color:var(--gold)}
/* Corrections live behind a disclosure so they never compete with the next step. */
.more{margin-top:16px}
.more > summary{list-style:none; cursor:pointer; font-size:14px; color:var(--ink-faint);
  text-decoration:underline; text-underline-offset:4px}
.more > summary::-webkit-details-marker{display:none}
.more > summary:hover{color:var(--ink)}
.pay-btns{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px}
.pay-btns button{border:1px solid var(--line); background:var(--cream-warm); border-radius:999px;
  padding:8px 16px; font-size:14px; color:var(--ink-soft); transition:border-color .2s}
.pay-btns button:hover{border-color:rgba(59,35,16,.4)}
.pay-btns button.confirming{border-color:var(--alert); background:var(--alert); color:var(--cream)}
.pay-btns .never{background:none; border:0; padding:0; color:var(--ink-soft);
  text-decoration:underline; text-underline-offset:4px}
.confirm-note{margin-top:8px; font-size:13.5px; color:var(--alert)}
.danger-box{border:1px solid rgba(166,57,28,.3); background:rgba(166,57,28,.05); border-radius:2px;
  padding:20px}
.danger-box h3{font-size:17px}
.link-danger{background:none; border:0; padding:0; font-size:14px; color:var(--ink-faint);
  text-decoration:underline; text-underline-offset:4px}
.link-danger:hover{color:var(--alert)}
.banner{margin-top:20px; border-radius:2px; padding:16px 20px; font-size:15px; line-height:1.6}
.banner.bad{border:1px solid rgba(166,57,28,.3); background:rgba(166,57,28,.06); color:var(--alert)}

/* ---------------------------------------------------------------- kitchen */
.daybar{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:22px}
.daybar input[type=date]{border:1px solid var(--line); background:var(--cream-warm);
  border-radius:999px; padding:7px 16px; font-size:14.5px}
.daybar input[type=date]:focus{outline:none; border-color:var(--gold)}
.daybar .print{border:1px solid rgba(168,126,46,.5); background:rgba(239,226,190,.4);
  border-radius:999px; padding:7px 16px; font-size:14.5px; color:var(--ink)}
.daybar .print:hover{border-color:var(--gold)}
.cook > li{border-bottom:1px solid var(--line); padding:22px 0; break-inside:avoid}
.cook > li:first-child{padding-top:0}
.cook > li:last-child{border-bottom:0; padding-bottom:0}
.cook .line{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between;
  gap:8px 24px}
.cook h3{font-size:21px}
.cook .qty{font-family:Fraunces,Georgia,serif; font-size:28px; font-weight:600; white-space:nowrap}
.cook .qty .of{margin-left:8px; font-family:Karla,sans-serif; font-size:12px; font-weight:400;
  letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint)}
.cook .split{margin-top:4px; font-size:13.5px; color:var(--ink-soft)}
.cook .vars{margin-top:8px; display:flex; flex-wrap:wrap; gap:4px 20px}
.cook .vars li{font-size:13.5px; color:var(--ink-soft)}
.cook .vars strong{font-weight:700; color:var(--ink)}
.cook .breakdown{margin-top:16px; display:grid; gap:8px}
.cook .breakdown > li{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 16px;
  border:1px solid var(--line-soft); background:var(--cream); border-radius:2px; padding:10px 16px}

  switch (status) {
    case "REQUESTED": return ["CONFIRMED"];
    case "NEW": return ["CONFIRMED"];
    case "CONFIRMED": return ["PREPARING"];
    case "PREPARING": return ["READY"];
    case "READY": return fulfilment === "PICKUP" ? ["DELIVERED"] : ["OUT_FOR_DELIVERY"];
    case "OUT_FOR_DELIVERY": return ["DELIVERED"];
    default: return [];

var KEY = "thediine.admin.preview.v2";
var S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S || !S.orders) S = freshData();
if (!S.menu) S.menu = freshMenu();
if (!S.settings) S.settings = freshSettings();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ----------------------------------------------------------- formatting */
function egp(piastres) {
  var pounds = piastres / 100;
  var hasFraction = piastres % 100 !== 0;
  return pounds.toLocaleString("en-EG", {
    minimumFractionDigits: hasFraction ? 2 : 0, maximumFractionDigits: 2
  }) + " EGP";
}
function total(o) { return o.items.reduce(function (n, i) { return n + i.unit * i.qty; }, 0); }
function longDate(d) {
  return new Date(d + "T00:00:00").toLocaleDateString("en-GB",
    { weekday: "short", day: "numeric", month: "short", year: "numeric" });
}
function fullDate(d) {
  return new Date(d + "T00:00:00").toLocaleDateString("en-GB",
    { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}
function daysAway(d) {
  var a = new Date(d + "T00:00:00").getTime();
  var b = new Date().setHours(0, 0, 0, 0);
  return Math.round((a - b) / 86400000);
}
function byNumber(n) {
  for (var i = 0; i < S.orders.length; i++) if (S.orders[i].number === n) return S.orders[i];
  return null;
}
function statusPill(s) { return '<span class="pill st-' + s + '">' + STATUS_LABELS[s] + "</span>"; }
function payPill(s) { return '<span class="pill pay-' + s + '">' + PAY_LABELS[s] + "</span>"; }
function typePill(t) {
  return '<span class="type' + (t === "EVENT" ? " ev" : "") + '">'
    + (t === "EVENT" ? "Event" : "Order") + "</span>";
}
function methodLabel(o) {
  if (o.method === "CASH") return o.fulfilment === "PICKUP" ? "Payment on pickup" : "Cash on delivery";
  return o.method === "INSTAPAY" ? "InstaPay" : "Card";
}
function itemLabel(i) {
  return [i.variant].concat(i.options || []).filter(Boolean).join(" \u00b7 ");
}

/* --------------------------------------------------------------- routing */
function hash() { return (location.hash.replace(/^#/, "").split("?")[0]) || "/"; }
function query() { return new URLSearchParams(location.hash.split("?")[1] || ""); }
function go(h) { location.hash = h; }
/* Filters live in the address, so a view can be kept or shared. */
function withQuery(base, patch) {
  var q = query();
  Object.keys(patch).forEach(function (k) {
    if (patch[k]) q.set(k, patch[k]); else q.delete(k);
  });
  var s = q.toString();
  return "#" + base + (s ? "?" + s : "");
}

/* ----------------------------------------------------------------- today */
function attention() {
  var a = { events: 0, payments: 0, fresh: 0 };
  S.orders.forEach(function (o) {
    if (o.type === "EVENT" && o.status === "REQUESTED") a.events++;
    if (o.payment === "AWAITING_VERIFICATION") a.payments++;
    if (o.type === "NORMAL" && o.status === "NEW") a.fresh++;
  });
  return a;
}
function viewToday() {
  var a = attention();
  var today = iso(0);
  var due = S.orders.filter(function (o) { return o.date === today && o.status !== "CANCELLED"; });
  var events = S.orders
    .filter(function (o) {
      return o.type === "EVENT" && OPEN.indexOf(o.status) >= 0 && daysAway(o.date) >= 0;
    })
    .sort(function (x, y) { return x.date < y.date ? -1 : 1; })
    .slice(0, 5);

  return "<main>"
    + '<div class="page-head"><div><p class="eyebrow">Today</p>'
    + "<h1 style=\"margin-top:8px\">Good to see you, " + esc(S.admin.name.split(" ")[0]) + "</h1></div>"
    + '<p class="when">' + new Date().toLocaleDateString("en-GB",
        { weekday: "long", day: "numeric", month: "long" }) + "</p></div>"
    + '<div class="stats">'
    + stat("Event requests waiting", a.events, withQuery("/orders", { status: "REQUESTED", type: "EVENT", payment: "", fulfilment: "", from: "", to: "", all: "", q: "" }))
    + stat("Payments to verify", a.payments, "#/orders?payment=AWAITING_VERIFICATION")
    + stat("New orders to confirm", a.fresh, "#/orders?type=NORMAL&status=NEW")
    + "</div>"
    + '<div class="grid two-up" style="margin-top:32px">'
    + '<section class="card"><header><h2>Going out today</h2>'
    + '<a href="#/kitchen?date=' + today + '">Kitchen list \u2192</a></header><div class="body">'
    + (due.length === 0
        ? '<p class="empty">Nothing is due today.</p>'
        : '<ul class="today-list">' + due.map(todayRow).join("") + "</ul>")
    + "</div></section>"
    + '<section class="card"><header><h2>Upcoming events</h2>'
    + '<a href="#/orders?type=EVENT&all=1">All events \u2192</a></header><div class="body">'
    + (events.length === 0
        ? '<p class="empty">No events coming up.</p>'
        : '<ul class="ev-list">' + events.map(eventRow).join("") + "</ul>")
    + "</div></section></div></main>";
}
function stat(label, n, href) {
  return '<a class="stat' + (n > 0 ? " alert" : "") + '" href="' + href + '">'
    + '<span class="lab">' + label + '</span><span class="n tnum">' + n + "</span></a>";
}
function todayRow(o) {
  return '<li><a href="#/order/' + o.number + '">'
    + '<span class="l1"><span class="num tnum">' + o.number + "</span>" + typePill(o.type)
    + '<span class="name">' + esc(o.name) + "</span>"
    + '<span class="amt tnum">' + egp(total(o)) + "</span></span>"
    + '<span class="l2"><span class="meta">' + o.time + " \u00b7 "
    + (o.fulfilment === "PICKUP" ? "Pickup" : "Delivery") + "</span>"
    + '<span class="pills">' + statusPill(o.status) + payPill(o.payment) + "</span></span>"
    + "</a></li>";
}
function eventRow(o) {
  var away = daysAway(o.date);
  return '<li><a href="#/order/' + o.number + '">'
    + '<span class="l1"><span class="occ">' + esc(o.occasion) + "</span>"
    + '<span class="guests">' + o.guests + " guests</span>"
    + '<span class="end">' + statusPill(o.status) + "</span></span>"
    + '<span class="l2"><span>' + longDate(o.date) + "</span>"
    + '<span class="away">' + (away === 0 ? "today" : away === 1 ? "tomorrow" : "in " + away + " days")
    + "</span>" + '<span class="num tnum">' + o.number + "</span></span>"

/* ---------------------------------------------------------------- orders */
function viewOrders() {
  var q = query();
  var fType = q.get("type"), fStatus = q.get("status"), fPay = q.get("payment");
  var fFul = q.get("fulfilment"), from = q.get("from") || "", to = q.get("to") || "";
  var search = (q.get("q") || "").trim().toLowerCase();
  var all = q.get("all") === "1";
  var open = !fType && !fStatus && !fPay && !fFul && !from && !to && !all;

  var list = S.orders.filter(function (o) {
    if (fType && o.type !== fType) return false;
    if (fStatus && o.status !== fStatus) return false;
    if (fPay && o.payment !== fPay) return false;
    if (fFul && o.fulfilment !== fFul) return false;
    if (from && o.date < from) return false;
    if (to && o.date > to) return false;
    if (!all && !fStatus && !fPay && OPEN.indexOf(o.status) < 0) return false;
    if (search && (o.number + " " + o.name + " " + o.mobile).toLowerCase().indexOf(search) < 0) {
      return false;
    }
    return true;
  }).sort(function (a, b) { return a.date < b.date ? -1 : 1; });

  var chip = function (href, on, label, small) {
    return '<a class="chip' + (small ? " sm" : "") + (on ? " on" : "") + '" href="' + href + '">'
      + label + "</a>";
  };
  var clear = "#/orders";

  return "<main>"
    + '<p class="eyebrow">Orders</p>'
    + '<h1 style="margin-top:12px">' + (open ? "Open orders" : "Orders") + "</h1>"
    + '<div class="filters"><div class="chips">'
    + chip(clear, open, "Open")
    + chip(withQuery("/orders", { all: "1", status: "", payment: "" }), all, "All")
    + '<span class="chip-div"></span>'
    + chip(withQuery("/orders", { type: fType === "NORMAL" ? "" : "NORMAL" }), fType === "NORMAL", "Normal")
    + chip(withQuery("/orders", { type: fType === "EVENT" ? "" : "EVENT" }), fType === "EVENT", "Events")
    + chip(withQuery("/orders", { type: "EVENT", status: "REQUESTED" }), fStatus === "REQUESTED", "Requests")
    + chip(withQuery("/orders", { payment: fPay === "AWAITING_VERIFICATION" ? "" : "AWAITING_VERIFICATION" }),
        fPay === "AWAITING_VERIFICATION", "To verify")
    + '<span class="chip-div"></span>'
    + chip(withQuery("/orders", { fulfilment: fFul === "DELIVERY" ? "" : "DELIVERY" }), fFul === "DELIVERY", "Delivery")
    + chip(withQuery("/orders", { fulfilment: fFul === "PICKUP" ? "" : "PICKUP" }), fFul === "PICKUP", "Pickup")
    + '<form class="search" id="search-form"><input type="search" id="q" value="'
    + esc(q.get("q") || "") + '" placeholder="Number, name or mobile">'
    + '<button type="submit">Search</button></form></div>'
    + '<div class="daterow"><span class="lab">Wanted for</span>'
    + chip(withQuery("/orders", { from: iso(0), to: iso(0) }), from === iso(0) && to === iso(0), "Today", true)
    + chip(withQuery("/orders", { from: iso(1), to: iso(1) }), from === iso(1) && to === iso(1), "Tomorrow", true)
    + chip(withQuery("/orders", { from: iso(0), to: iso(7) }), from === iso(0) && to === iso(7), "Next 7 days", true)
    + chip(withQuery("/orders", { from: iso(0), to: iso(30) }), from === iso(0) && to === iso(30), "Next 30 days", true)
    + '<label>From <input type="date" id="from" value="' + esc(from) + '"></label>'
    + '<label>to <input type="date" id="to" value="' + esc(to) + '"></label>'
    + (from || to ? '<a class="clear" href="' + withQuery("/orders", { from: "", to: "" }) + '">Clear dates</a>' : "")
    + "</div>"
    + '<p class="count">' + list.length + " shown"
    + (open ? "" : ' \u00b7 <a href="' + clear + '">Clear every filter</a>') + "</p></div>"
    + '<section class="card" style="margin-top:20px">'
    + (list.length === 0
        ? '<div class="body"><p class="empty" style="text-align:center">Nothing matches that.</p></div>'
        : '<ul class="rows">' + list.map(orderRow).join("") + "</ul>")
    + "</section></main>";
}
function orderRow(o) {
  return '<li><a class="row" href="#/order/' + o.number + '">'
    + '<span class="num tnum">' + o.number + "</span>" + typePill(o.type)
    + '<span><span class="name" style="display:block">' + esc(o.name) + "</span>"

/* ----------------------------------------------------------------- order */
function viewOrder(number) {

  var t = total(o);
  var terms = cancellationTerms({ type: o.type, date: o.date, total: t });
  var finished = o.status === "DELIVERED" || o.status === "CANCELLED";
  var dishNotes = o.items.filter(function (i) { return i.instr; });
  var fullAddress = o.details ? o.address + " \u2014 " + o.details : (o.address || "");

        : "")
    /* Everything the customer asked for, given real weight. */

        ? '<section class="notes-banner"><p class="lab2">Please note</p>'
          + (o.notes ? "<p>" + esc(o.notes) + "</p>" : "")
          + (dishNotes.length
              ? "<ul>" + dishNotes.map(function (i) {
                  return "<li><strong>" + esc(i.name) + "</strong> \u2014 " + esc(i.instr) + "</li>";
                }).join("") + "</ul>"
              : "")
          + "</section>"
        : "")
    + '<div class="grid cols" style="margin-top:28px"><div class="grid">'

    + card(isEvent ? "The event" : "The order",

        + (o.email ? pair("Email", esc(o.email)) : "") + "</dl>"
        /* Every order is confirmed on WhatsApp, so it is an action. */
        + '<a class="wa" href="https://wa.me/2' + esc(o.mobile.replace(/^0/, ""))

        + '<path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 '
        + '9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2Zm0 '
        + '18.15h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.19 8.19 0 0 '
        + '1-1.26-4.38c0-4.54 3.7-8.23 8.25-8.23a8.23 8.23 0 0 1 8.24 8.24c0 4.54-3.7 8.23-8.24 '
        + '8.23Zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.24-.64.8-.78.97-.15'
        + '.16-.29.18-.53.06-.25-.13-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.01-.38'
        + '.11-.5.11-.11.25-.29.37-.44.13-.15.17-.25.25-.41.08-.17.04-.31-.02-.44-.06-.12-.56-1.35-'
        + '.76-1.85-.2-.48-.4-.42-.56-.43h-.48c-.16 0-.43.06-.65.31-.22.25-.86.84-.86 2.05s.88 2.38 '
        + '1 2.54c.13.17 1.73 2.64 4.19 3.7.58.26 1.04.41 1.4.52.59.19 1.13.16 1.55.1.47-.07 '
        + '1.47-.6 1.67-1.18.21-.58.21-1.07.15-1.18-.06-.11-.22-.17-.47-.29Z"/></svg>'
        + "Message " + esc(o.name.split(" ")[0]) + " on WhatsApp</a>")

    + (o.address
        ? card(isEvent ? "Venue" : "Delivery address",
            '<p class="addr">' + esc(o.address) + "</p>"
            + (o.details ? '<p class="addr-more">' + esc(o.details) + "</p>" : "")
            + (o.area ? '<p class="addr-area">Area: ' + esc(o.area) + "</p>" : "")

            + esc(fullAddress) + '">Copy</button>'

            + "</p>"

        + '</dt><dd class="tnum">' + egp(t) + "</dd></div>"
        + (!isEvent && o.fulfilment === "DELIVERY"
            ? "<div><dt>Delivery</dt><dd>Not set \u2014 confirm with the customer</dd></div>" : "")
        + '<div class="grand"><dt>Total</dt><dd class="tnum">' + egp(t) + "</dd></div></dl>"
        + (isEvent ? '<p class="fine">Priced for ' + o.guests + " guests at " + o.multiplier
            + " the regular menu price.</p>" : ""))

    + (isEvent
        ? card("Anything else for the day?",
            (o.extras && o.extras.length
              ? o.extras.map(function (x) { return '<span class="tag">' + x + "</span>"; }).join("")
              : '<p style="font-size:15px;color:var(--ink-soft)">Nothing requested.</p>')
            + '<p class="fine">Quote each of these separately. None of it is in the total above.</p>'
            + (o.extrasNotes ? '<p class="note">\u201c' + esc(o.extrasNotes) + "\u201d</p>" : ""))
        : "")

    + card("History",
        '<ol class="timeline">' + o.history.map(function (h, i) {
          var last = i === o.history.length - 1;
          return '<li class="' + (last ? "last" : "") + '"><span class="dot"></span>'
            + '<p class="what">' + STATUS_LABELS[h.to]
            + (h.from ? '<span class="from">from ' + STATUS_LABELS[h.from].toLowerCase() + "</span>" : "")
            + "</p>"
            + '<p class="meta">' + esc(h.t) + " \u00b7 "
            + (h.by ? esc(h.by) : "the customer, on the website") + "</p>"
            + (h.note ? '<p class="n2">' + esc(h.note) + "</p>" : "") + "</li>";
        }).join("") + "</ol>")
    + "</div>"

    /* ---- the actions: one obvious next step, everything else quieter ---- */
    + '<div class="grid side">'
    + (o.status === "REQUESTED"
        ? card("This is a request",
            '<p style="font-size:15px;color:var(--ink-soft)">Accepting this turns the request into '
            + "a confirmed booking. Decide what it does to the day.</p>"
            + '<div class="opts">'
            + '<button type="button" class="opt-btn on" data-mode="BLOCK_DAY">'
            + '<span class="t">Block the day</span>'
            + '<span class="b">No regular orders can be taken for that date.</span></button>'
            + '<button type="button" class="opt-btn" data-mode="KEEP_DAY_OPEN">'
            + '<span class="t">Keep the day open</span>'
            + '<span class="b">Regular orders can still be taken alongside it.</span></button></div>'
            + '<button type="button" class="btn btn-primary btn-main" style="margin-top:20px" '
            + 'id="confirm-event">Confirm this event</button>')
        : card("Order status",
            '<p style="font-size:14.5px;color:var(--ink-soft)">Now: <strong>'
            + STATUS_LABELS[o.status] + "</strong></p>"
            + (nextStatuses(o.status, o.fulfilment).length === 0
                ? '<p class="fine">This order has reached the end of its journey.</p>'
                : '<div style="margin-top:16px">'
                  + nextStatuses(o.status, o.fulfilment).map(function (s, i) {
                      return '<button type="button" data-to="' + s + '" class="'
                        + (i === 0 ? "btn btn-primary btn-main" : "btn-second") + '">'

        '<p style="font-size:14.5px;color:var(--ink-soft)">' + methodLabel(o) + "</p>"
        + (o.payment === "AWAITING_VERIFICATION"
            ? '<div style="margin-top:16px"><p class="waiting">Waiting on you: check that <strong>'
              + egp(t) + "</strong> arrived before marking this paid.</p>"
              + '<button type="button" class="btn-paid" data-pay="PAID">'
              + "I have checked it \u2014 mark paid</button></div>"
            : "")
        /* A transfer reference only exists for a transfer. Cash has none. */
        + (o.method === "INSTAPAY"
            ? '<div class="field"><label class="lab" for="ref">Transfer reference '
              + '<span style="text-transform:none;letter-spacing:normal">optional</span></label>'
              + '<input type="text" id="ref" value="' + esc(o.reference || "") + '"></div>'
            : "")
        + '<details class="more"' + (PAY_CONFIRM ? " open" : "") + '>'
        + "<summary>Change the payment status by hand</summary>"
        + '<div class="pay-btns">'
        + ["UNPAID", "AWAITING_VERIFICATION", "PAID", "REFUNDED"].filter(function (s) {
            return s !== o.payment && !(o.payment === "AWAITING_VERIFICATION" && s === "PAID");
          }).map(function (s) {
            var confirming = PAY_CONFIRM === s;
            return '<button type="button" data-pay="' + s + '"'
              + (confirming ? ' class="confirming"' : "") + ">"
              + (confirming ? "Yes \u2014 mark " + PAY_LABELS[s].toLowerCase()
                            : "Mark " + PAY_LABELS[s].toLowerCase()) + "</button>";
          }).join("")
        + (PAY_CONFIRM ? '<button type="button" class="never" id="pay-never">Never mind</button>' : "")
        + "</div>"
        + (PAY_CONFIRM
            ? '<p class="confirm-note">' + (PAY_CONFIRM === "REFUNDED"
                ? "This records the payment as refunded. Click again to confirm."
                : "This takes a paid order back to unpaid. Click again to confirm.") + "</p>"
            : "")
        + "</details>"
        + '<p class="fine">This changes the payment only. The order stays exactly where it is.</p>')

    + (finished ? "" :
        '<div id="cancel-slot">'
        + '<button type="button" class="link-danger" id="open-cancel">Cancel this order</button></div>')
    + "</div></div></main>";
}
function card(title, body) {
  return '<section class="card"><header><h2>' + title + "</h2></header>"
    + '<div class="body">' + body + "</div></section>";
}
function pair(label, value, full) {
  return "<div" + (full ? ' class="full"' : "") + "><dt>" + label + "</dt><dd>" + value + "</dd></div>";
}
function cancelBox(o) {
  var terms = cancellationTerms({ type: o.type, date: o.date, total: total(o) });
  return '<div class="danger-box"><h3>Cancel this order</h3>'
    + '<p style="margin-top:8px;font-size:14.5px;color:var(--ink-soft)">'
    + (terms.within
        ? "This is inside the free cancellation window, so nothing is charged."
        : "This is outside the free window. A " + terms.percent + "% charge of <strong>"
          + egp(terms.charge) + "</strong> will be <strong>recorded</strong> \u2014 this system "
          + "does not collect it.")
    + '</p><div class="field"><label class="lab" for="reason">Reason</label>'

}

/* --------------------------------------------------------------- kitchen */
/* Grouped by DISH, not by dish-and-variation: the kitchen's first question is
   how much of a thing to make. The variations and the orders are underneath. */
function prepFor(date) {
  var dishes = {};
  S.orders.forEach(function (o) {
    if (o.date !== date || COOKING.indexOf(o.status) < 0) return;
    o.items.forEach(function (i) {
      var d = dishes[i.name] || (dishes[i.name] = {
        name: i.name, total: 0, normal: 0, event: 0, variations: [], lines: []
      });
      d.total += i.qty;
      if (o.type === "EVENT") d.event += i.qty; else d.normal += i.qty;
      d.lines.push({ number: o.number, type: o.type, qty: i.qty,
        label: itemLabel(i), instr: i.instr });
      var label = itemLabel(i);
      if (label) {
        var found = null;
        d.variations.forEach(function (v) { if (v.label === label) found = v; });
        if (found) found.qty += i.qty; else d.variations.push({ label: label, qty: i.qty });
      }
    });
  });
  return Object.keys(dishes).sort().map(function (k) {
    var d = dishes[k];
    /* One form only is not a variation worth listing separately. */
    if (d.variations.length < 2) d.variations = [];
    return d;
  });
}
function viewKitchen() {
  var date = query().get("date") || iso(0);
  var dishes = prepFor(date);
  var orders = S.orders.filter(function (o) {
    return o.date === date && o.status !== "CANCELLED";
  });
  var cooking = orders.filter(function (o) { return COOKING.indexOf(o.status) >= 0; });
  var mixed = cooking.some(function (o) { return o.type === "EVENT"; })
           && cooking.some(function (o) { return o.type === "NORMAL"; });
  var count = dishes.reduce(function (n, d) { return n + d.total; }, 0);
  var shift = function (days) {
    var d = new Date(date + "T00:00:00");
    d.setDate(d.getDate() + days);
    return "#/kitchen?date=" + d.toISOString().slice(0, 10);
  };

  return "<main>"
    + '<div class="print-head"><h2>The Diine \u2014 prep sheet</h2><p>' + fullDate(date) + "</p></div>"
    + '<div class="no-print"><p class="eyebrow">Kitchen</p>'
    + '<h1 style="margin-top:12px">' + fullDate(date) + "</h1>"
    + '<p class="sub">' + (dishes.length === 0
        ? "Nothing confirmed to cook."
        : dishes.length + (dishes.length === 1 ? " dish, " : " dishes, ") + count
          + " in total, across " + cooking.length + (cooking.length === 1 ? " order." : " orders."))
    + "</p>"
    + '<div class="daybar"><a class="chip" href="' + shift(-1) + '">\u2190 Day before</a>'
    + '<a class="chip' + (date === iso(0) ? " on" : "") + '" href="#/kitchen?date=' + iso(0) + '">Today</a>'
    + '<a class="chip" href="' + shift(1) + '">Day after \u2192</a>'
    + '<label class="sr" for="kdate">Jump to a date</label>'
    + '<input type="date" id="kdate" value="' + date + '">'
    + '<button type="button" class="print" id="print">Print the prep sheet</button></div></div>'

    + '<div class="grid k-cols" style="margin-top:28px">'
    + '<section class="card"><header><h2>To cook</h2></header><div class="body">'
    + (dishes.length === 0
        ? '<p class="empty">Nothing to cook for this day. Only confirmed orders appear here \u2014 '
          + "an event request that has not been accepted is not counted.</p>"
        : '<ul class="cook">' + dishes.map(function (d) { return dishRow(d, mixed); }).join("") + "</ul>")
    + "</div></section>"

    + '<div class="side"><section class="card"><header><h2>Orders that day</h2></header>'
    + '<div class="body">'
    + (orders.length === 0
        ? '<p style="font-size:15px;color:var(--ink-soft)">None.</p>'
        : '<div class="mini">' + orders.map(function (o) {
            return '<a href="#/order/' + o.number + '">'
              + '<span class="l1"><span class="num tnum">' + o.number + "</span>" + typePill(o.type)
              + '<span class="end">' + statusPill(o.status) + "</span></span>"
              + '<span class="l2">' + esc(o.name) + " \u00b7 " + o.time + "</span>"
              + '<span class="l3">' + (o.type === "EVENT" ? o.guests + " guests"
                  : o.fulfilment === "PICKUP" ? "Pickup" : "Delivery") + "</span>"
              + (o.notes ? '<span class="l4">' + esc(o.notes) + "</span>" : "") + "</a>";
          }).join("") + "</div>")
    + "</div></section></div></div></main>";
}
function dishRow(d, mixed) {
  return "<li>"
    + '<div class="line"><h3>' + esc(d.name) + "</h3>"
    + '<p class="qty tnum">\u00d7' + d.total + '<span class="of">total</span></p></div>'
    + (mixed && d.normal > 0 && d.event > 0
        ? '<p class="split"><span class="tnum">' + d.normal + "</span> for regular orders, "
          + '<span class="tnum">' + d.event + "</span> for events</p>"
        : "")
    + (d.variations.length
        ? '<ul class="vars">' + d.variations.map(function (v) {
            return "<li><strong class=\"tnum\">\u00d7" + v.qty + "</strong> " + esc(v.label) + "</li>";
          }).join("") + "</ul>"
        : "")
    + '<ul class="breakdown">' + d.lines.map(function (l) {
        return '<li><a class="onum tnum" href="#/order/' + l.number + '">' + l.number + "</a>"
          + '<span class="oq tnum">\u00d7' + l.qty + "</span>"
          + typePill(l.type)
          + (l.label ? '<span class="opt">' + esc(l.label) + "</span>" : "")
          + (l.instr
              ? '<span class="instr"><span><span class="k">Note</span>'
                + '<span class="v">' + esc(l.instr) + "</span></span></span>"
              : "")
          + "</li>";
      }).join("") + "</ul></li>";
}


/* ==================================================================== menu
   Menu management: the dish list, the dish editor, the courses. The rules
   here are the same ones the real admin enforces -- a price is typed in
   pounds and held in piastres, a dish has either one price or priced
   choices, a choice that has been ordered cannot be removed, bands may not
   overlap, and a dish is retired rather than deleted. */
function freshMenu() { return JSON.parse(JSON.stringify(MENU_SEED)); }

var CARRY = false;      /* keep the message across one navigation */
var MENU_MSG = null;    /* a one-off line at the top of the page */
var MENU_ERR = null;
var BANDS = null;       /* the bands being edited, before they are saved */
var EV_CHOICE = null;   /* the priced choice the event amounts are shown for */
var SEARCH = "";        /* what has been typed into the menu's search */
var RETIRING = false;

function catFor(slug) {
  var c = S.menu.cats.filter(function (x) { return x.slug === slug; })[0];
  return c ? c.name : slug;
}
function liveDishes() {
  return S.menu.dishes.filter(function (d) { return !d.archived; });
}
function dishBy(id) {
  return S.menu.dishes.filter(function (d) { return d.id === id; })[0];
}
function unchecked(d) {
  return d.al.filter(function (a) { return !a.r; }).length > 0;
}
function dishFlags(d) {
  var f = [];
  /* only a gap where the business has said this dish needs a unit */
  if (d.unitreq && (!d.unit || !d.unitok)) f.push(["Selling unit needed", false]);
  if (unchecked(d)) f.push(["Allergens unchecked", true]);
  if (d.note) f.push(["Has a note", false]);
  if (d.price === null && !d.v.length) f.push(["No price", true]);
  return f;
}
function priceText(d) {
  if (d.v.length) {
    var ps = d.v.map(function (v) { return v.price; });
    var lo = Math.min.apply(null, ps), hi = Math.max.apply(null, ps);
    return lo === hi ? egp(lo) : egp(lo) + " \u2013 " + egp(hi);
  }
  return d.price === null ? "No price" : egp(d.price);
}
function pounds(piastres) {
  return piastres % 100 === 0 ? String(piastres / 100) : (piastres / 100).toFixed(2);
}
function toPiastres(text) {
  var n = Number(String(text).replace(/,/g, "").trim());
  if (!isFinite(n) || n < 0) return null;
  return Math.round(n * 100);
}
/* A choice that appears on any order is part of that order's history. */
function choiceOrdered(dish, name) {
  return S.orders.filter(function (o) {
    return o.items.filter(function (i) {
      return i.name === dish.name && i.variant === name;
    }).length > 0;
  }).length > 0;
}
function val(sel) { var el = $(sel); return el ? el.value.trim() : ""; }
function multLabel(bp) {
  var x = bp / 10000;
  return (x % 1 === 0 ? String(x) : String(x)) + "\u00d7";
}

/* ------------------------------------------------------------ the list */
function viewMenu() {
  var show = query().get("show") || "";
  var all = liveDishes();
  var counts = {
    off: all.filter(function (d) { return !d.avail; }).length,
    unit: all.filter(function (d) { return d.unitreq && (!d.unit || !d.unitok); }).length,
    al: all.filter(function (d) { return unchecked(d); }).length,
    notes: all.filter(function (d) { return !!d.note; }).length
  };
  var keep = function (d) {
    if (SEARCH) {
      var hay = (d.name + " " + d.v.map(function (v) { return v.name; }).join(" ")).toLowerCase();
      if (hay.indexOf(SEARCH.toLowerCase()) < 0) return false;
    }
    if (show === "unavailable") return !d.avail;
    if (show === "no-unit") return d.unitreq && (!d.unit || !d.unitok);
    if (show === "unreviewed") return unchecked(d);
    if (show === "notes") return !!d.note;
    return true;
  };
  var chip = function (v, label) {
    return '<a class="chip sm' + (show === v ? " on" : "") + '" href="'
      + (v ? "#/menu?show=" + v : "#/menu") + '">' + label + "</a>";
  };
  var shown = all.filter(keep);
  var courses = S.menu.cats.map(function (c) {
    var mine = all.filter(function (d) { return d.cat === c.slug; });
    var here = mine.filter(keep);
    if (!here.length) return "";
    return '<section class="course"><header><h2>' + esc(c.name) + "</h2>"
      + '<span class="n tnum">' + mine.length + (mine.length === 1 ? " dish" : " dishes")
      + "</span></header><ul>"
      + here.map(function (d) { return menuRow(d, mine.indexOf(d), mine.length); }).join("")
      + "</ul></section>";
  }).join("");

  return "<main>" + flashes()
    + '<div class="menu-head"><div><p class="eyebrow">Menu</p>'
    + "<h1>" + all.length + (all.length === 1 ? " dish" : " dishes") + "</h1></div>"
    + '<div class="acts"><a class="quiet" href="#/menu/categories">Courses</a>'
    + '<a class="btn btn-primary" href="#/menu/new">Add a dish</a></div></div>'
    + '<div class="stats">'
    + stat("Unavailable today", counts.off, "#/menu?show=unavailable")
    + stat("Allergens to check", counts.al, "#/menu?show=unreviewed")
    + stat("Selling unit needed", counts.unit, "#/menu?show=no-unit")
    + "</div>"
    + '<div class="chips" style="margin-top:28px">'
    + chip("", "Everything") + chip("unavailable", "Unavailable")
    + chip("unreviewed", "Allergens unchecked")
    + (counts.unit ? chip("no-unit", "Selling unit needed") : "")
    + (counts.notes ? chip("notes", "Has a note") : "")
    + "</div>"
    /* seventy-odd dishes is too many to scroll for one of them */
    + '<div class="chips" style="margin-top:20px">'
    + '<input id="dish-search" type="search" placeholder="Find a dish" value="'
    + esc(SEARCH) + '">'
    + (SEARCH
        ? '<span class="hint">' + shown.length + (shown.length === 1 ? " dish" : " dishes")
          + "</span>"
        : "")
    + (courses || '<p class="sub" style="margin-top:24px">Nothing here.</p>')
    + "</main>";
}

function menuRow(d, i, n) {
  return '<li class="drow' + (d.avail ? "" : " off") + '">'
    + '<span class="mv"><button type="button" data-m="move" data-id="' + d.id + '" data-dir="up"'
    + (i === 0 ? " disabled" : "") + ' aria-label="Move ' + esc(d.name) + ' up">\u25b2</button>'
    + '<button type="button" data-m="move" data-id="' + d.id + '" data-dir="down"'
    + (i === n - 1 ? " disabled" : "") + ' aria-label="Move ' + esc(d.name) + ' down">\u25bc</button></span>'
    + '<a class="nm" href="#/menu/' + d.id + '"><strong>' + esc(d.name) + "</strong>"
    + dishFlags(d).map(function (f) {
        return '<span class="fl' + (f[1] ? " warn" : "") + '">' + f[0] + "</span>";
      }).join("") + "</a>"
    + '<span class="pr tnum">' + priceText(d) + "</span>"
    + '<button type="button" class="av ' + (d.avail ? "on" : "off") + '" data-m="avail" data-id="'
    + d.id + '">' + (d.avail ? "Available" : "Unavailable") + "</button></li>";
}

function flashes() {
  var out = "";
  if (MENU_ERR) out += '<p class="err" style="margin-bottom:20px">' + esc(MENU_ERR) + "</p>";
  if (MENU_MSG) out += '<p class="flash">' + esc(MENU_MSG) + "</p>";
  return out;
}
function panel(title, note, body) {
  return '<section class="card"><header><h2>' + title + "</h2>"
    + (note ? '<p class="pnote">' + note + "</p>" : "") + "</header>"
    + '<div class="body">' + body + "</div></section>";
}
function field(label, id, control, hint) {
  return '<div class="f"><label class="lab" for="' + id + '">' + label + "</label>" + control
    + (hint ? '<p class="hint">' + hint + "</p>" : "") + "</div>";
}
function checkbox(on, m, title, body) {
  return '<button type="button" class="check" data-m="' + m + '">'
    + '<span class="box' + (on ? " on" : "") + '">' + (on ? "\u2713" : "") + "</span>"
    + '<span><span class="t">' + title + '</span><span class="b">' + body + "</span></span></button>";
}

/* ---------------------------------------------------------- the editor */
function viewDish(id) {
  var d = dishBy(id);
  if (!d) return "<main><h1>That dish is not here.</h1>"
    + '<p class="sub"><a class="crumb" href="#/menu">Back to the menu</a></p></main>';
  if (EV_CHOICE === null && d.v.length) EV_CHOICE = d.v[0].name;
  if (BANDS === null) BANDS = (d.tiers || []).map(function (t) {
    return { min: String(t.min), max: String(t.max), mult: t.bp ? String(t.bp / 10000) : "",
             price: t.price ? pounds(t.price) : "" };
  });

  var courseOptions = S.menu.cats.map(function (c) {
    return '<option value="' + c.slug + '"' + (c.slug === d.cat ? " selected" : "") + ">"
      + esc(c.name) + "</option>";
  }).join("");

  /* what changes most often, and nothing else */
  var dish = '<div class="fgrid">'
    + field("Name", "d-name", '<input id="d-name" value="' + esc(d.name) + '">')
    + field("Description", "d-desc", '<textarea id="d-desc">' + esc(d.desc || "") + "</textarea>",
            "Shown under the name on the menu.")
    + '</div><div class="fgrid two" style="margin-top:18px">'
    + field("Course", "d-cat", '<select id="d-cat">' + courseOptions + "</select>")
    + field("Regular price", "d-price", '<input id="d-price" inputmode="decimal" value="'
        + (d.price === null ? "" : pounds(d.price)) + '"' + (d.v.length ? " disabled" : "") + ">",
        d.v.length ? "Priced by its choices below."
                   : "In EGP. What a normal order pays.")
    + "</div>"
    + '<button type="button" class="btn btn-primary" style="margin-top:22px" data-m="save-dish">'
    + "Save the dish</button>";

  /* available today -- which is not the same thing as retired */
  var availability = '<div class="chips">'
    + '<button type="button" class="avail' + (d.avail ? " on" : "") + '" data-m="avail-on">Available</button>'
    + '<button type="button" class="avail no' + (d.avail ? "" : " on") + '" data-m="avail-off">Unavailable</button>'
    + "</div>"
    + '<p class="hint" style="margin-top:14px">'
    + (d.avail
        ? "Customers can order it."
        : "Customers can still see it on the menu, but cannot order it. Nothing is archived and "
          + "nothing is lost \u2014 flick it back whenever it is on again.")
    + "</p>"
    + '<div style="margin-top:20px; border-top:1px solid var(--line-soft); padding-top:16px">'
    + checkbox(d.featured, "feature", "Show on the homepage", "Featured dishes lead the homepage.")
    + "</div>"
    + '<p class="hint" style="margin-top:18px">Taking a dish off the menu for good is a different '
    + "thing, and it is at the bottom of this page.</p>";

  /* how it is sold: real, but not the daily edit */
  var serving = '<div class="fgrid">'
    + field("Selling unit", "d-unit", '<input id="d-unit" value="' + esc(d.unit || "") + '">',
            "What one of these is: a tray, a kilo, twelve pieces. Left empty until the business "
            + "says \u2014 never invented.")
    + "</div>"
    + checkbox(!!d.unitreq, "unit-req", "This dish needs a selling unit",
        "Only then is a missing unit flagged on the menu. Off for anything sold as it is.")
    + (d.unit ? checkbox(!!d.unitok, "unit-ok", "This selling unit is confirmed",
        "Until it is, the dish keeps its reminder.") : "")
    + '<div class="fgrid two" style="margin-top:18px">'
    + field("Serves from", "d-smin", '<input id="d-smin" class="tnum" inputmode="numeric" value="'
        + (d.smin === null ? "" : d.smin) + '">', "Optional.")
    + field("Serves up to", "d-smax", '<input id="d-smax" class="tnum" inputmode="numeric" value="'
        + (d.smax === null ? "" : d.smax) + '">', "Optional.")
    + field("Smallest order", "d-minq", '<input id="d-minq" class="tnum" inputmode="numeric" value="'
        + d.minq + '">', "How few a customer may order.")
    + field("Ordered in steps of", "d-step", '<input id="d-step" class="tnum" inputmode="numeric" value="'
        + d.step + '">')
    + "</div>"
    + '<div class="fgrid" style="margin-top:18px">'
    + field("Note to yourself", "d-note", '<input id="d-note" value="' + esc(d.note || "") + '">',
            "Never shown to a customer.")
    + "</div>"
    + '<button type="button" class="btn btn-primary" style="margin-top:22px" data-m="save-details">'
    + "Save these details</button>";

  var choices = (d.v.length
      ? "<ul>" + d.v.map(function (v, i) {
          return '<li class="vrow"><input class="n" id="v-name-' + i + '" value="' + esc(v.name)
            + '"><input class="p tnum" id="v-price-' + i + '" inputmode="decimal" value="'
            + pounds(v.price) + '">'
            + '<button type="button" class="mini" data-m="v-save" data-i="' + i + '">Save</button>'
            + '<button type="button" class="mini ' + (v.avail ? "on" : "off")
            + '" data-m="v-avail" data-i="' + i + '">' + (v.avail ? "On" : "Off") + "</button>"
            + '<button type="button" class="linky" data-m="v-remove" data-i="' + i + '">Remove</button>'
            + "</li>";
        }).join("") + "</ul>"
      : "")
    + '<div class="newrow">'
    + field("New choice", "nv-name", '<input id="nv-name" placeholder="With chicken">')
    + field("Price", "nv-price", '<input id="nv-price" class="tnum" inputmode="decimal" placeholder="800" style="width:8rem">')
    + '<button type="button" class="mini" data-m="v-add">Add it</button></div>';

  var comes = (d.og || []).map(function (g, gi) {
    return "<p class=\"lab\" style=\"margin-top:16px\">" + esc(g.name) + "</p>"
      + '<div style="margin-top:10px">' + g.ch.map(function (c, ci) {
          return '<button type="button" class="ach' + (c.avail ? " on" : "")
            + '" data-m="choice" data-g="' + gi + '" data-c="' + ci + '">' + esc(c.name)
            + (c.avail ? "" : " \u2014 off") + "</button>";
        }).join("") + "</div>";
  }).join("");

  var allergens = (unchecked(d)
      ? '<p class="waiting">These have not been checked against the recipe yet.</p>' : "")
    + S.menu.allerg.map(function (a) {
        var on = d.al.filter(function (x) { return x.s === a.slug; }).length > 0;
        return '<button type="button" class="ach' + (on ? " on" : "") + '" data-m="allergen" data-slug="'
          + a.slug + '">' + esc(a.name) + "</button>";
      }).join("")
    + (unchecked(d)
        ? '<div style="margin-top:8px"><button type="button" class="mini" data-m="allergens-ok">'
          + "I have checked these against the recipe</button></div>"
        : "");

  /* the price the bands are worked out from: the price as it is being typed,
     or -- for a dish sold as priced choices -- the choice being looked at */
  var basis = d.v.length
    ? (d.v.filter(function (v) { return v.name === EV_CHOICE; })[0] || d.v[0]).price
    : d.price;

  var ladder = S.menu.tiers.map(function (t) {
    return '<li><span class="g">' + t.min + "\u2013" + t.max + " guests</span>"
      + '<span class="x">' + multLabel(t.bp) + "</span>"
      + '<span class="amt tnum" data-ev-bp="' + t.bp + '">'
      + (basis === null ? "\u2014" : egp(Math.round((basis * t.bp) / 10000))) + "</span></li>";
  }).join("");

  var choicePicker = d.v.length
    ? '<div class="band" style="margin-bottom:16px"><label for="evchoice">Prices shown for</label>'
      + '<select id="evchoice">' + d.v.map(function (v) {
          return '<option value="' + esc(v.name) + '"'
            + (v.name === EV_CHOICE ? " selected" : "") + ">" + esc(v.name)
            + " \u2014 " + egp(v.price) + "</option>";
        }).join("") + "</select></div>"
    : "";

  var bands = BANDS.map(function (t, i) {
    var shows = t.mult
      ? ' <span class="tnum amt" data-ev-bp="' + Math.round(Number(t.mult || 0) * 10000) + '">= '
        + (basis === null ? "\u2014" : egp(Math.round(basis * Number(t.mult || 0)))) + "</span>"
      : "";
    return '<div class="band"><input class="g tnum" aria-label="From guests" data-b="min" data-i="'
      + i + '" value="' + esc(t.min) + '"> to '
      + '<input class="g tnum" aria-label="To guests" data-b="max" data-i="' + i + '" value="'
      + esc(t.max) + '"> guests: '
      + '<input class="m tnum" aria-label="Multiplier" placeholder="2.5" data-b="mult" data-i="' + i
      + '" value="' + esc(t.mult) + '"> \u00d7 \u2014 or a flat '
      + '<input class="x tnum" aria-label="Flat price" placeholder="EGP" data-b="price" data-i="' + i
      + '" value="' + esc(t.price) + '">' + shows
      + '<button type="button" class="linky" data-m="band-del" data-i="' + i + '">Remove</button></div>';
  }).join("");

  var event = checkbox(d.ev, "ev-toggle", "Scale this dish by guest count",
        "Off means an event pays the regular price for it.")
    + (d.ev
        ? '<div style="margin-top:16px">' + choicePicker + "</div>"
          + ((d.tiers && d.tiers.length)
            ? '<p class="hint">It has bands of its own, so the shared ladder does not apply to it.</p>'
            : '<p class="hint">It follows the shared ladder:</p><ul class="ladder">' + ladder + "</ul>")
          + (basis === null
              ? '<p class="hint" style="margin-top:8px">Give the dish a price and the event amounts appear here.</p>'
              : "")
          + bands
          + '<div class="chips" style="margin-top:16px">'
          + '<button type="button" class="mini" data-m="band-add">Add a band</button>'
          + (BANDS.length ? '<button type="button" class="mini" data-m="bands-save">Save these bands</button>' : "")
          + ((d.tiers && d.tiers.length)
              ? '<button type="button" class="linky" data-m="bands-clear">Go back to the shared ladder</button>' : "")
          + "</div>"
        : "")
    + '<div class="fgrid" style="margin-top:20px">'
    + field("Why it scales this way", "d-evnote",
        '<input id="d-evnote" value="' + esc(d.evnote || "") + '">', "Never shown to a customer.")
    + '</div><button type="button" class="mini" style="margin-top:14px" data-m="save-evnote">'
    + "Save the note</button>";

  var retire = RETIRING
    ? '<div class="danger-box"><h3>Take ' + esc(d.name) + " off the menu for good?</h3>"
      + '<p class="fine">It stays on every order it has ever been part of. It simply stops being '
      + "something a customer can order.</p>"
      + '<div class="chips" style="margin-top:16px">'
      + '<button type="button" class="btn btn-danger" data-m="retire">Yes, retire it</button>'
      + '<button type="button" class="linky" data-m="retire-no">Keep it</button></div></div>'
    : '<button type="button" class="linky" data-m="retire-open">'
      + "Take this dish off the menu for good</button>";

  return "<main>" + '<a class="crumb" href="#/menu">\u2190 The menu</a>' + flashes()
    + '<div class="menu-head"><div><p class="eyebrow">' + esc(catFor(d.cat)) + "</p>"
    + "<h1>" + esc(d.name) + "</h1></div></div>"
    + '<div class="stack">'
    + panel("The dish", "", dish)
    + panel("Availability",
        "Whether customers can order this dish right now. It is a switch you can flick back the "
        + "same day, and it never touches an order that has already been placed.", availability)
    + panel("Priced choices",
        "A dish either has one price or a set of priced choices \u2014 Noodles with vegetables, "
        + "with chicken, with shrimps. Adding the first choice clears the single price.", choices)
    + (comes ? panel("What comes with it",
        "Choices the customer makes at no extra cost. Switch one off when you have run out of it.",
        comes) : "")
    + panel("Serving and order details",
        "How this dish is sold and how few of it a customer may order.", serving)
    + panel("Allergens",
        "Tagged from the menu wording during setup and never checked against a recipe. "
        + "Confirm them before launch.", allergens)
    + panel("Event pricing",
        "An event portion is cooked for the whole guest list, so it is priced by guest count.", event)
    + '<div class="retire">' + retire + "</div>"
    + "</div></main>";
}

/* ---------------------------------------------------------- a new dish */
function viewNewDish() {
  var courseOptions = S.menu.cats.map(function (c) {
    return '<option value="' + c.slug + '">' + esc(c.name) + "</option>";

        "Only a name is needed to start. Everything else can follow once it is decided.",

        + '<div class="fgrid two" style="margin-top:18px">'

/* ------------------------------------------------------------ courses */
function viewCourses() {
  var rows = S.menu.cats.map(function (c, i) {
    var n = liveDishes().filter(function (d) { return d.cat === c.slug; }).length;
    return '<section class="card"><div class="body">'
      + '<div style="display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px">'
      + '<span class="mv" style="padding-bottom:10px">'
      + '<button type="button" data-m="cat-move" data-i="' + i + '" data-dir="up"'
      + (i === 0 ? " disabled" : "") + ' aria-label="Move ' + esc(c.name) + ' up">\u25b2</button>'
      + '<button type="button" data-m="cat-move" data-i="' + i + '" data-dir="down"'
      + (i === S.menu.cats.length - 1 ? " disabled" : "")
      + ' aria-label="Move ' + esc(c.name) + ' down">\u25bc</button></span>'
      + '<div class="f" style="flex:1; min-width:12rem"><label class="lab" for="c-name-' + i
      + '">Name</label><input id="c-name-' + i + '" value="' + esc(c.name) + '"></div>'
      + '<span class="tnum" style="padding-bottom:12px; font-size:13.5px; color:var(--ink-faint)">'
      + n + (n === 1 ? " dish" : " dishes") + "</span></div>"
      + '<div class="f" style="margin-top:16px"><label class="lab" for="c-desc-' + i
      + '">Description</label><input id="c-desc-' + i + '" value="' + esc(c.desc || "") + '"></div>'
      + '<div class="chips" style="margin-top:16px">'
      + '<button type="button" class="mini" data-m="cat-save" data-i="' + i + '">Save</button>'
      + '<button type="button" class="mini ' + (c.active ? "on" : "off") + '" data-m="cat-active" data-i="'
      + i + '">' + (c.active ? "Showing on the site" : "Hidden from the site") + "</button>"
      + "</div></div></section>";
  }).join("");
  return "<main>" + '<a class="crumb" href="#/menu">\u2190 The menu</a>' + flashes()
    + '<div class="menu-head"><div><p class="eyebrow">Menu</p><h1>Courses</h1>'
    + '<p class="sub">The order here is the order they appear in on the site.</p></div></div>'
    + '<div class="stack">' + rows + "</div></main>";
}

/* ------------------------------------------------------------- actions */
function readBands() {
  document.querySelectorAll("[data-b]").forEach(function (el) {
    var i = Number(el.dataset.i);
    if (BANDS[i]) BANDS[i][el.dataset.b] = el.value.trim();
  });
}
document.addEventListener("click", function (e) {
  var t = e.target.closest("button");
  if (!t || !t.dataset.m) return;
  var m = t.dataset.m;
  var h = hash();
  var d = t.dataset.id ? dishBy(t.dataset.id)
        : (h.indexOf("/menu/") === 0 ? dishBy(decodeURIComponent(h.slice(6))) : null);
  MENU_MSG = null; MENU_ERR = null;

  if (m === "avail" && d) { d.avail = !d.avail; save(); render(); return; }
  if (m === "avail-on" && d) { d.avail = true; save(); render(); return; }
  if (m === "avail-off" && d) { d.avail = false; save(); render(); return; }
  if (m === "unit-req" && d) { d.unitreq = !d.unitreq; save(); render(); return; }
  if (m === "feature" && d) { d.featured = !d.featured; save(); render(); return; }
  if (m === "unit-ok" && d) { d.unitok = !d.unitok; save(); render(); return; }

  if (m === "move" && d) {
    var sibs = liveDishes().filter(function (x) { return x.cat === d.cat; });
    var at = sibs.indexOf(d), to = at + (t.dataset.dir === "up" ? -1 : 1);
    if (to < 0 || to >= sibs.length) return;
    var a = S.menu.dishes.indexOf(sibs[at]), b = S.menu.dishes.indexOf(sibs[to]);
    S.menu.dishes[a] = sibs[to]; S.menu.dishes[b] = sibs[at];
    save(); render(); return;
  }

  if ((m === "save-dish" || m === "save-details") && d) {
    var name = $("#d-name") ? val("#d-name") : d.name;
    if (!name) { MENU_ERR = "A dish needs a name."; render(); return; }
    if (!d.v.length && $("#d-price")) {
      var price = val("#d-price");
      var p = price === "" ? null : toPiastres(price);
      if (price !== "" && p === null) { MENU_ERR = "That price is not a number."; render(); return; }
      d.price = p;
    }
    var whole = function (sel, fallback) {
      var v = val(sel);
      if (v === "") return fallback;
      var n = Math.round(Number(v));
      return isFinite(n) && n > 0 ? n : fallback;
    };
    d.name = name;
    d.desc = val("#d-desc") || null;
    d.cat = val("#d-cat");
    if ($("#d-unit")) d.unit = val("#d-unit") || null;
    if (!d.unit) d.unitok = false;
    if ($("#d-smin")) {
      d.smin = whole("#d-smin", null);
      d.smax = whole("#d-smax", null);
      d.minq = whole("#d-minq", 1);
      d.step = whole("#d-step", 1);
      d.note = val("#d-note") || null;
    }
    MENU_MSG = "Saved.";
    save(); render(); return;
  }
  if (m === "save-evnote" && d) {
    d.evnote = val("#d-evnote") || null;
    MENU_MSG = "Saved."; save(); render(); return;
  }

  /* ---- priced choices */
  if (m === "v-save" && d) {
    var i = Number(t.dataset.i);
    var vn = val("#v-name-" + i), vp = toPiastres(val("#v-price-" + i));
    if (!vn) { MENU_ERR = "A choice needs a name."; render(); return; }
    if (vp === null) { MENU_ERR = "That price is not a number."; render(); return; }
    d.v[i].name = vn; d.v[i].price = vp;
    MENU_MSG = "Saved."; save(); render(); return;
  }
  if (m === "v-avail" && d) {
    d.v[Number(t.dataset.i)].avail = !d.v[Number(t.dataset.i)].avail;
    save(); render(); return;
  }
  if (m === "v-remove" && d) {
    var vi = Number(t.dataset.i);
    if (choiceOrdered(d, d.v[vi].name)) {
      MENU_ERR = d.v[vi].name + " has been ordered before, so it cannot be removed. "
        + "Switch it off instead.";
      render(); return;
    }
    d.v.splice(vi, 1);
    if (!d.v.length && d.price === null) MENU_MSG = "That was the last choice \u2014 give the dish a price.";
    save(); render(); return;
  }
  if (m === "v-add" && d) {
    var nn = val("#nv-name"), np = toPiastres(val("#nv-price"));
    if (!nn) { MENU_ERR = "A choice needs a name."; render(); return; }
    if (np === null) { MENU_ERR = "That price is not a number."; render(); return; }
    if (!d.v.length) d.price = null;   /* the first choice clears the single price */
    d.v.push({ name: nn, price: np, avail: true });
    save(); render(); return;
  }
  if (m === "choice" && d) {
    var g = d.og[Number(t.dataset.g)].ch[Number(t.dataset.c)];
    g.avail = !g.avail; save(); render(); return;
  }

  /* ---- allergens */
  if (m === "allergen" && d) {
    var slug = t.dataset.slug;
    var had = d.al.filter(function (x) { return x.s === slug; })[0];
    if (had) d.al = d.al.filter(function (x) { return x.s !== slug; });
    else d.al.push({ s: slug, r: true });
    save(); render(); return;
  }
  if (m === "allergens-ok" && d) {
    d.al.forEach(function (a) { a.r = true; });
    MENU_MSG = "Marked as checked."; save(); render(); return;
  }

  /* ---- event bands */
  if (m === "ev-toggle" && d) { d.ev = !d.ev; save(); render(); return; }
  if (m === "band-add") {
    readBands(); BANDS.push({ min: "", max: "", mult: "", price: "" }); render(); return;
  }
  if (m === "band-del") {
    readBands(); BANDS.splice(Number(t.dataset.i), 1); render(); return;
  }
  if (m === "bands-clear" && d) { d.tiers = []; BANDS = []; save(); render(); return; }
  if (m === "bands-save" && d) {
    readBands();
    var rows = [], bad = null;
    BANDS.forEach(function (t2) {
      var lo = Number(t2.min), hi = Number(t2.max);
      if (!lo || !hi || hi < lo) bad = bad || "Each band needs a guest count to run from and to.";
      if (!t2.mult && !t2.price) bad = bad || "Each band needs a multiplier or a flat price.";
      rows.push({ min: lo, max: hi,
        bp: t2.mult ? Math.round(Number(t2.mult) * 10000) : null,
        price: t2.price ? toPiastres(t2.price) : null });
    });
    rows.sort(function (a2, b2) { return a2.min - b2.min; });
    for (var k = 1; k < rows.length; k++) {
      if (rows[k].min <= rows[k - 1].max) bad = bad || "Those bands overlap. Every guest count can "
        + "only fall in one band.";
    }
    if (bad) { MENU_ERR = bad; render(); return; }
    d.tiers = rows;
    BANDS = rows.map(function (r) {
      return { min: String(r.min), max: String(r.max), mult: r.bp ? String(r.bp / 10000) : "",
               price: r.price ? pounds(r.price) : "" };
    });
    MENU_MSG = "Saved."; save(); render(); return;
  }

  /* ---- retiring */
  if (m === "retire-open") { RETIRING = true; render(); return; }
  if (m === "retire-no") { RETIRING = false; render(); return; }
  if (m === "retire" && d) {
    d.archived = true; RETIRING = false;
    MENU_MSG = d.name + " is off the menu. It is still on every order it was part of.";
    CARRY = true; save(); go("#/menu"); render(); return;
  }

  /* ---- a new dish */
  if (m === "new-dish") {
    var newName = val("#n-name");
    if (!newName) { MENU_ERR = "A dish needs a name."; render(); return; }
    var newPrice = val("#n-price");
    var pp = newPrice === "" ? null : toPiastres(newPrice);
    if (newPrice !== "" && pp === null) { MENU_ERR = "That price is not a number."; render(); return; }
    var id = newName.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    if (dishBy(id)) { MENU_ERR = "There is already a dish with that name."; render(); return; }
    S.menu.dishes.push({ id: id, name: newName, cat: val("#n-cat"), price: pp, unit: null,
      unitok: false, unitreq: false, smin: null, smax: null, minq: 1, step: 1, note: null, avail: true,
      featured: false, ev: true, evnote: null, desc: null, al: [], og: [], v: [], tiers: [] });
    BANDS = null;
    MENU_MSG = "Added. Its selling unit is left empty until you say what one of these is.";
    CARRY = true; save(); go("#/menu/" + id); render(); return;
  }

  /* ---- courses */
  if (m === "cat-move") {
    var ci = Number(t.dataset.i), cto = ci + (t.dataset.dir === "up" ? -1 : 1);
    if (cto < 0 || cto >= S.menu.cats.length) return;
    var tmp = S.menu.cats[ci];
    S.menu.cats[ci] = S.menu.cats[cto]; S.menu.cats[cto] = tmp;
    save(); render(); return;
  }
  if (m === "cat-save") {
    var k2 = Number(t.dataset.i);
    var cn = val("#c-name-" + k2);
    if (!cn) { MENU_ERR = "A course needs a name."; render(); return; }
    S.menu.cats[k2].name = cn;
    S.menu.cats[k2].desc = val("#c-desc-" + k2) || null;
    MENU_MSG = "Saved."; save(); render(); return;
  }
  if (m === "cat-active") {
    var k3 = Number(t.dataset.i);
    S.menu.cats[k3].active = !S.menu.cats[k3].active;
    save(); render(); return;
  }
});


/* ================================================================ settings
   The business's own rules. A list down the side, one page at a time, and a
   save per card. The rules mirrored here are the ones the real admin writes;
   the preview keeps them in this browser. */

function freshSettings() {
  return {
    values: JSON.parse(JSON.stringify(SETTINGS_SEED)),
    areas: [],
    closed: [],
    payments: [
      { id: "cash", builtIn: "CASH", name: "Cash", instructions: "", kind: "MANUAL",
        enabled: true, verify: false, used: 0 },
      { id: "instapay", builtIn: "INSTAPAY", name: "InstaPay", instructions: "", kind: "MANUAL",
        enabled: true, verify: true, used: 0 },
      { id: "card", builtIn: "CARD", name: "Card payment", instructions: "", kind: "INTEGRATED",
        enabled: false, verify: false, used: 0 }
    ],
    servings: [
      { id: "returnable", builtIn: "RETURNABLE", name: "Returnable dishes",
        description: "Served in our own dishes, which we collect afterwards.",
        available: true, used: 0 },
      { id: "disposable", builtIn: "DISPOSABLE", name: "Disposable dishes",
        description: "Served in disposable containers \u2014 nothing to return.",
        available: true, used: 0 }
