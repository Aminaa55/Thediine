}

var SET_MSG = null;
var SET_ERR = null;
var SET_DAY = null;      /* the calendar day being looked at */
var SET_ADD = null;      /* which "add" form is open */
var SET_OPEN = null;     /* which row is being edited */
var LADDER = null;       /* the ladder being edited, in EGP */
var LADDER_BASE = null;  /* the dish price it is written against, in EGP */

function S_() { return S.settings.values; }
function sOn(key) { return S_()[key] !== "false"; }
function setVal(key, value) { S_()[key] = value; }

var DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
var DAY_SHORT = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

function workingDays() {
  var raw = S_().working_days;
  if (!raw) return [];
  return raw.split(",").filter(function (d) { return d !== ""; }).map(Number);
}

var SET_SECTIONS = [
  ["#/settings/business", "Business details"],
  ["#/settings/ordering", "Ordering"],
  ["#/settings/delivery", "Delivery & pickup"],
  ["#/settings/calendar", "Calendar & capacity"],
  ["#/settings/events", "Events"],
  ["#/settings/payment", "Payment"],
  ["#/settings/serving", "Serving setup"]
];

function undecided() {
  var out = {};
  if (!S.settings.areas.length) out["#/settings/delivery"] = true;
  if (!S_().order_time_from || !S_().order_time_until) out["#/settings/delivery"] = true;
  if (!S_().serving_setup_policy_en) out["#/settings/serving"] = true;
  if (!S_().contact_email) out["#/settings/business"] = true;
  return out;
}
function undecidedCount() {
  var n = 0;
  if (!S.settings.areas.length) n++;
  if (!S_().order_time_from || !S_().order_time_until) n++;
  if (!S_().serving_setup_policy_en) n++;
  if (!S_().contact_email) n++;
  return n;
}

/* --------------------------------------------------------------- the shell */
function settingsShell(inner) {
  var h = hash();
  var flags = undecided();
  var n = undecidedCount();

  return "<main>"
    + '<div class="set-top"><div><p class="eyebrow">Settings</p>'
    + "<h1>How the business runs</h1></div>"
    + '<p class="hint">Changes apply from now on. They never rewrite an order already placed.</p>'
    + "</div>"
    + '<div class="set-shell"><nav class="set-side" aria-label="Settings sections"><ul>'
    + SET_SECTIONS.map(function (s) {
        return '<li><a href="' + s[0] + '"' + (h === s[0].slice(1) ? ' class="on"' : "") + ">"
          + s[1] + (flags[s[0]] ? '<span class="dot"></span>' : "") + "</a></li>";
      }).join("")
    + "</ul></nav>"
    + '<div class="set-body">' + setFlashes() + inner + "</div></div>"
    + (n
        ? '<p class="hist-note">' + n + (n === 1 ? " thing is" : " things are")
          + " still undecided, marked in gold where they belong. Nothing has been chosen on your "
          + "behalf.</p>"
        : "")
    + "</main>";
}

function setFlashes() {
  var out = "";
  if (SET_ERR) out += '<p class="err" style="margin-bottom:16px">' + esc(SET_ERR) + "</p>";
  if (SET_MSG) out += '<p class="flash">' + esc(SET_MSG) + "</p>";
  return out;
}
function setHead(title) { return '<h2 class="set-h">' + title + "</h2>"; }
function setCard(title, note, body, saveKey, saveLabel, footer) {
  return '<section class="set-card"><h3>' + title + "</h3>"
    + (note ? '<p class="note">' + note + "</p>" : "")
    + body
    + (saveKey
        ? '<div class="save-row"><button type="button" class="btn-save" data-set="' + saveKey
          + '">' + (saveLabel || "Save") + "</button></div>"
        : "")
    + (footer || "") + "</section>";
}
function setField(label, id, control, hint) {
  return '<div class="f"><label class="lab" for="' + id + '">' + label + "</label>" + control
    + (hint ? '<p class="hint">' + hint + "</p>" : "") + "</div>";
}
function setSwitch(key, title, body) {
  return '<button type="button" class="check" data-set-toggle="' + key + '">'
    + '<span class="box' + (sOn(key) ? " on" : "") + '">' + (sOn(key) ? "\u2713" : "") + "</span>"
    + '<span><span class="t">' + title + "</span>"
    + (body ? '<span class="b">' + body + "</span>" : "") + "</span></button>";
}
function toDecide(text) {
  return '<p class="to-decide"><span class="eyebrow">Still to decide</span>' + text + "</p>";
}
function historyNote(text) { return '<p class="hist-note">' + text + "</p>"; }
function pill(on, onLabel, offLabel, action, id) {
  return '<button type="button" class="pillbtn ' + (on ? "on" : "off") + '" data-set="' + action
    + '" data-id="' + id + '">' + (on ? onLabel : offLabel) + "</button>";
}

/* ---------------------------------------------------------------- calendar */
function viewSetCalendar() {
  var days = workingDays();
  var chips = DAY_NAMES.map(function (name, i) {
    return '<button type="button" class="dayc' + (days.indexOf(i) >= 0 ? " on" : "")
      + '" data-set="day" data-i="' + i + '">' + name + "</button>";
  }).join("");

  var byDate = {};
  S.settings.closed.forEach(function (c) { byDate[c.date] = c; });

  var start = new Date();
  start.setUTCHours(0, 0, 0, 0);
  start.setUTCDate(start.getUTCDate() - start.getUTCDay());
  var today = new Date().toISOString().slice(0, 10);
  var cells = [];
  for (var i = 0; i < 42; i++) {
    var d = new Date(start);
    d.setUTCDate(d.getUTCDate() + i);
    var key = d.toISOString().slice(0, 10);
    cells.push(byDate[key] || { date: key, closed: false, max: null, note: null, eventNumber: null });
  }

  var grid = DAY_SHORT.map(function (s) { return '<span class="hd">' + s + "</span>"; }).join("")
    + cells.map(function (c) {
        var weekday = new Date(c.date + "T00:00:00.000Z").getUTCDay();
        var weeklyOff = days.indexOf(weekday) < 0;
        var past = c.date < today;
        var held = !!c.eventNumber;
        var shut = c.closed || weeklyOff;
        var cls = past ? "past" : held ? "held" : shut ? "shut" : "open";
        return '<button type="button" class="dcell ' + cls
          + (SET_DAY === c.date ? " sel" : "") + '" data-set="pick-day" data-date="' + c.date + '"'
          + (past ? " disabled" : "") + ">"
          + "<span>" + Number(c.date.slice(8, 10)) + "</span>"
          + '<span class="sub">'
          + (held ? "event" : shut ? "closed" : c.max !== null ? "max " + c.max : "")
          + "</span></button>";
      }).join("");

  var picked = SET_DAY ? (byDate[SET_DAY] || { date: SET_DAY, closed: false, max: null, note: null, eventNumber: null }) : null;

  return settingsShell(setHead("Calendar &amp; capacity")
    + setCard("The days you work",
        "A day switched off is closed every week. Use the calendar below for a single date.",
        '<div class="chips">' + chips + "</div>", "days")
    + setCard("The weeks ahead",
        "Click a day to close it, or to cook a different number that day. Usually "
        + S_().normal_daily_capacity + " orders a day.",
        '<div class="cal">' + grid + "</div>"
        + (picked ? dayPanel(picked) : '<p class="hint" style="margin-top:12px">Red is closed, '
            + "gold is an event you have accepted.</p>"))
    + historyNote("Closing a day stops new orders for it. An order already booked for that day is "
        + "untouched \u2014 cancel one deliberately if you need to."));
}

function dayPanel(day) {
  var readable = new Date(day.date + "T00:00:00.000Z").toLocaleDateString("en-GB",
    { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" });

  if (day.eventNumber) {
    return '<div class="day-panel held"><p><strong>' + readable + "</strong> is held by event "
      + '<a href="#/order/' + day.eventNumber + '">' + day.eventNumber + "</a>. "
      + "Change it on the event itself.</p></div>";
  }

  return '<div class="day-panel"><p class="d">' + readable + "</p>"
    + '<div class="newrow">'
    + (day.closed
        ? '<button type="button" class="mini" data-set="open-day" data-date="' + day.date
          + '">Open this day</button>'
        : '<input id="close-why" placeholder="Why, for you" aria-label="Why it is closed">'
          + '<button type="button" class="pillbtn off" data-set="close-day" data-date="' + day.date
          + '">Close this day</button>')
    + "</div>"
    + (day.closed
        ? ""
        : '<div class="newrow cap-row"><label for="day-cap">Orders this day</label>'
          + '<input id="day-cap" class="tnum" inputmode="numeric" placeholder="'
          + S_().normal_daily_capacity + '" value="' + (day.max === null ? "" : day.max) + '">'
          + '<button type="button" class="mini" data-set="day-cap" data-date="' + day.date
          + '">Save</button>'
          + (day.max !== null
              ? '<button type="button" class="linky" data-set="day-uncap" data-date="' + day.date
                + '">Back to ' + S_().normal_daily_capacity + "</button>"
              : "")
          + "</div>")
    + "</div>";
}

/* ------------------------------------------------------------------ events */
function viewSetEvents() {
  if (LADDER === null) loadLadder();
  var base = Number(String(LADDER_BASE).replace(/,/g, "")) * 100;

  var rows = LADDER.map(function (t, i) {
    return '<div class="band">'
      + '<input class="g tnum" aria-label="From guests" data-l="min" data-i="' + i + '" value="'
      + esc(t.min) + '"> to '
      + '<input class="g tnum" aria-label="To guests" data-l="max" data-i="' + i + '" value="'
      + esc(t.max) + '"> guests '
      + '<input class="x tnum" aria-label="Price for this band" data-l="price" data-i="' + i
      + '" value="' + esc(t.price) + '"> EGP'
      + '<button type="button" class="linky" data-set="band-del" data-i="' + i + '">Remove</button>'
      + "</div>";
  }).join("");

  var examples = S.menu.dishes
    .filter(function (d) { return !d.archived && d.price !== null; })
    .sort(function (a, b) { return b.price - a.price; })
    .slice(0, 2);

  var meaning = examples.length && base > 0 && LADDER.length
    ? '<div class="means"><p class="eyebrow">What that means for other dishes</p>'
      + examples.map(function (d) {
          return "<p><span class=\"nm\">" + esc(d.name) + "</span> (" + egp(d.price) + ")"
            + LADDER.slice(0, 3).map(function (t) {
                var p = Number(String(t.price).replace(/,/g, "")) * 100;
                if (!p) return "";
                return " \u00b7 " + t.min + "\u2013" + t.max + ": "
                  + egp(Math.round((d.price * p) / base));
              }).join("") + "</p>";
        }).join("") + "</div>"
    : "";

  var mode = S_().event_default_capacity_mode;
  var choice = function (id, title) {
    return '<button type="button" class="choicep' + (mode === id ? " on" : "")
      + '" data-set="mode" data-mode="' + id + '">' + title + "</button>";
  };
  var own = S.menu.dishes.filter(function (d) {
    return !d.archived && d.tiers && d.tiers.length;
  }).length;

  return settingsShell(setHead("Events")
    + setCard("What an event needs", "",
        '<div class="fgrid two">'
        + setField("Notice, in days", "s-evnotice",
            '<input id="s-evnotice" inputmode="numeric" value="' + esc(S_().event_notice_days) + '">')
        + setField("Most guests", "s-evguests",
            '<input id="s-evguests" inputmode="numeric" value="' + esc(S_().event_max_guests) + '">',
            "A request for more is refused.")
        + "</div>",
        "evrules")
    + setCard("Cancelling an event", "The percentage is shared with regular orders.",
        '<div class="fgrid two">'
        + setField("Free window", "s-evfree",
            '<input id="s-evfree" inputmode="numeric" value="' + esc(S_().event_free_cancellation_hours) + '">',
            "Hours before.")
        + setField("Late cancellation", "s-evpct",
            '<input id="s-evpct" inputmode="numeric" value="' + esc(S_().late_cancellation_percent) + '">',
            "% of the total.")
        + "</div>",
        "evcancel")
    + setCard("When you accept an event",
        "Which answer is offered first. You are still asked each time.",
        '<div class="chips">' + choice("BLOCK_DAY", "Block the day")
        + choice("KEEP_DAY_OPEN", "Keep the day open") + "</div>",
        "evmode")
    + setCard("Event prices by guest count",
        "Set against one dish price. Every other dish moves in the same proportion, so you never "
        + "price seventy dishes by hand.",
        '<div class="newrow">'
        + setField("For a dish that normally costs", "ladder-base",
            '<input id="ladder-base" class="tnum" inputmode="decimal" value="'
            + esc(String(LADDER_BASE)) + '">', "In EGP.")
        + "</div>" + rows
        + '<div class="chips" style="margin-top:12px">'
        + '<button type="button" class="mini" data-set="band-add">Add a band</button></div>'
        + meaning,
        "ladder", "Save these prices",
        '<p class="hint" style="margin-top:14px">'
        + (own === 0
            ? "Every dish follows this. A dish can be given its own prices on the dish itself."
            : own + (own === 1 ? " dish has" : " dishes have")
              + " their own event prices and ignore this.")
        + "</p>")
    + historyNote("An event order stores the price of every dish on it and the band it was priced "
        + "in. Changing these prices changes the next quote, never one already sent."));
}

function loadLadder() {
  var ref = Number(S_().event_ladder_reference_piastres || 100000);
  LADDER_BASE = String(ref / 100);
  LADDER = S.menu.tiers.map(function (t) {
    return {
      min: String(t.min), max: String(t.max),
      price: String(Math.round((ref * t.bp) / 10000) / 100)
    };
  });
}
function readLadder() {
  document.querySelectorAll("[data-l]").forEach(function (el) {
    var i = Number(el.dataset.i);
    if (LADDER[i]) LADDER[i][el.dataset.l] = el.value.trim();
  });
  if ($("#ladder-base")) LADDER_BASE = $("#ladder-base").value.trim();
}

                    '<input id="pe-inst" value="' + esc(o.instructions) + '">'))

                  + '<span class="box' + (o.verify ? " on" : "") + '">' + (o.verify ? "\u2713" : "")
                  + '</span><span><span class="t">The money comes before delivery</span></span></button>'

            + '<div class="chips" style="margin-top:12px">'
            + '<button type="button" class="mini" data-set="pay-save" data-id="' + o.id + '">Save</button>'
            + (o.builtIn ? ""
                : '<button type="button" class="linky" data-set="pay-remove" data-id="' + o.id
                  + '">Remove</button>')
            + "</div></div>"
          : "")
      + "</li>";

  var adder = SET_ADD === null
    ? '<div class="newrow"><span class="hint">Add payment method</span>'
      + '<button type="button" class="mini" data-set="add-manual">Manual</button>'
      + '<button type="button" class="mini" data-set="add-integrated">Needs an integration</button>'
      + "</div>"
    : '<div class="addbox"><p class="hint">'
      + (SET_ADD === "MANUAL"
          ? "Money that arrives outside this website \u2014 a bank transfer, a wallet. You confirm "
            + "each one by hand."
          : "A provider that has to be built and connected first. It is recorded here, and stays "
            + "off to customers until that work is done.")
      + '</p><div class="fgrid two">'
      + setField("Name", "pm-name", '<input id="pm-name" placeholder="Bank transfer">',
          "What the customer sees.")
      + setField("Details for the customer", "pm-inst",
          '<input id="pm-inst" placeholder="Account number, name">', "Where to send it.")
      + "</div>"
      + (SET_ADD === "MANUAL"
          ? '<button type="button" class="check" data-set="new-verify">'
            + '<span class="box' + (NEW_VERIFY ? " on" : "") + '">' + (NEW_VERIFY ? "\u2713" : "")
            + '</span><span><span class="t">The money comes before delivery</span>'
            + '<span class="b">Those orders arrive awaiting verification.</span></span></button>'
          : "")
      + '<div class="chips" style="margin-top:12px">'
      + '<button type="button" class="btn-save" data-set="pay-add">Add it</button>'
      + '<button type="button" class="linky" data-set="add-cancel">Cancel</button></div></div>';

  var instapay = S.settings.payments.filter(function (o) { return o.builtIn === "INSTAPAY"; })[0];

  return settingsShell(setHead("Payment")
    + setCard("How customers can pay",
        "Everything here is settled by hand: someone confirms the money arrived.",
        rows + adder)
    + (instapay
        ? setCard("InstaPay details", "Shown at checkout when a customer chooses InstaPay.",
            '<div class="fgrid two">'
            + setField("Transfer to", "s-ipn",
                '<input id="s-ipn" value="' + esc(S_().instapay_number) + '">')
            + setField("Anything else to say", "s-ipd",
                '<input id="s-ipd" placeholder="Nothing extra" value="'
                + esc(S_().instapay_account_details) + '">')
            + "</div>",
            "instapay")
        : "")
    + historyNote("An order records how it was paid for, by name, at the time it was placed. "
        + "Renaming or retiring a method never changes it, and payment status is still only ever "
        + "set by you."));
}

/* ---------------------------------------------------------------- actions */
var NEW_VERIFY = true;

function whole(sel, min, max, what) {
  var v = val(sel);
  var n = Number(v);
  if (!/^\d+$/.test(v) || n < min || n > max) {
    SET_ERR = what + " must be a whole number between " + min + " and " + max + ".";
    return null;
  }
  return String(n);
}
function payBy(id) { return S.settings.payments.filter(function (o) { return o.id === id; })[0]; }
function servBy(id) { return S.settings.servings.filter(function (o) { return o.id === id; })[0]; }

document.addEventListener("click", function (e) {
  var t = e.target.closest("button");
  if (!t) return;

  if (t.dataset.setToggle) {
    var key = t.dataset.setToggle;
    SET_MSG = null; SET_ERR = null;
    setVal(key, sOn(key) ? "false" : "true");
    save(); render(); return;
  }

  if (!t.dataset.set) return;
  var m = t.dataset.set;
  SET_MSG = null; SET_ERR = null;
  var i = t.dataset.i === undefined ? null : Number(t.dataset.i);
  var id = t.dataset.id;

  /* ---- business details */
  if (m === "contact") {
    var em = val("#s-em");
    if (em !== "" && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)) {
      SET_ERR = "That does not look like an email address."; render(); return;
    }
    setVal("whatsapp_number", val("#s-wa"));
    setVal("contact_instagram", val("#s-ig"));
    setVal("contact_email", em);
    SET_MSG = "Saved."; save(); render(); return;
  }

  /* ---- ordering */
  if (m === "notice") {
    var h = whole("#s-notice", 0, 720, "The notice period");
    var cap = whole("#s-cap", 1, 50, "The daily capacity");
    if (h === null || cap === null) { render(); return; }
    setVal("normal_notice_hours", h); setVal("normal_daily_capacity", cap);
    SET_MSG = "Saved."; save(); render(); return;
  }
  if (m === "minimum") {
    var raw = val("#s-min").replace(/,/g, "");
    if (raw !== "" && !(isFinite(Number(raw)) && Number(raw) >= 0)) {
      SET_ERR = "That is not an amount in EGP."; render(); return;
    }
    setVal("minimum_order_value_piastres", raw === "" ? "" : String(Math.round(Number(raw) * 100)));
    SET_MSG = "Saved."; save(); render(); return;
  }
  if (m === "cancel") {
    var nf = whole("#s-nfree", 0, 720, "The free cancellation window");
    var ef = whole("#s-efree", 0, 2160, "The free cancellation window");
    var pc = whole("#s-pct", 0, 100, "The late-cancellation charge");
    if (nf === null || ef === null || pc === null) { render(); return; }
    setVal("normal_free_cancellation_hours", nf);
    setVal("event_free_cancellation_hours", ef);
    setVal("late_cancellation_percent", pc);
    SET_MSG = "Saved."; save(); render(); return;
  }

  /* ---- delivery */
  if (m === "pickup" || m === "days" || m === "evmode") {
    SET_MSG = "Saved."; save(); render(); return;
  }
  if (m === "hours") {
    var from = val("#s-from"), until = val("#s-until");
    if ((from === "") !== (until === "")) {
      SET_ERR = "Give both a start and an end, or leave both empty."; render(); return;
    }
    if (from !== "" && until <= from) {
      SET_ERR = "The end has to be after the start."; render(); return;
    }
    setVal("order_time_from", from); setVal("order_time_until", until);
    SET_MSG = "Saved."; save(); render(); return;
  }
  if (m === "area-add") {
    var an = val("#new-area"), af = val("#new-fee").replace(/,/g, "");
    if (!an) { SET_ERR = "An area needs a name."; render(); return; }
    if (af === "" || !isFinite(Number(af)) || Number(af) < 0) {
      SET_ERR = "Give the delivery fee for this area, in EGP."; render(); return;
    }
    S.settings.areas.push({ name: an, fee: Math.round(Number(af) * 100), active: true, used: 0 });
    save(); render(); return;
  }
  if (m === "area-save") {
    var nn = val("#a-name-" + i), nf2 = val("#a-fee-" + i).replace(/,/g, "");
    if (!nn) { SET_ERR = "An area needs a name."; render(); return; }
    if (nf2 === "" || !isFinite(Number(nf2)) || Number(nf2) < 0) {
      SET_ERR = "Give the delivery fee for this area, in EGP."; render(); return;
    }
    S.settings.areas[i].name = nn;
    S.settings.areas[i].fee = Math.round(Number(nf2) * 100);
    SET_MSG = "Saved."; save(); render(); return;
  }
  if (m === "area-active") {
    S.settings.areas[i].active = !S.settings.areas[i].active; save(); render(); return;
  }
  if (m === "area-remove") { S.settings.areas.splice(i, 1); save(); render(); return; }
  if (m === "area-up" || m === "area-down") {
    var to = i + (m === "area-up" ? -1 : 1);
    if (to < 0 || to >= S.settings.areas.length) return;
    var tmp = S.settings.areas[i];
    S.settings.areas[i] = S.settings.areas[to]; S.settings.areas[to] = tmp;
    save(); render(); return;
  }

  /* ---- calendar */
  if (m === "day") {
    var days = workingDays();
    var at = days.indexOf(i);
    if (at >= 0) days.splice(at, 1); else days.push(i);
    setVal("working_days", days.sort(function (a, b) { return a - b; }).join(","));
    render(); return;
  }
  if (m === "pick-day") {
    SET_DAY = SET_DAY === t.dataset.date ? null : t.dataset.date;
    render(); return;
  }
  if (m === "close-day") {
    var d = t.dataset.date;
    var row = S.settings.closed.filter(function (c) { return c.date === d; })[0];
    var why = val("#close-why") || null;
    if (row) { row.closed = true; row.note = why; }
    else S.settings.closed.push({ date: d, closed: true, max: null, note: why, eventNumber: null });
    save(); render(); return;
  }
  if (m === "open-day") {
    var od = t.dataset.date;
    S.settings.closed = S.settings.closed.filter(function (c) { return c.date !== od; });
    save(); render(); return;
  }
  if (m === "day-cap") {
    var cd = t.dataset.date, cn = val("#day-cap");
    if (!/^\d+$/.test(cn) || Number(cn) > 50) {
      SET_ERR = "A day's capacity is a whole number up to 50."; render(); return;
    }
    var have = S.settings.closed.filter(function (c) { return c.date === cd; })[0];
    if (have) have.max = Number(cn);
    else S.settings.closed.push({ date: cd, closed: false, max: Number(cn), note: null, eventNumber: null });
    SET_MSG = "Saved."; save(); render(); return;
  }
  if (m === "day-uncap") {
    var ud = t.dataset.date;
    S.settings.closed = S.settings.closed.filter(function (c) { return c.date !== ud; });
    save(); render(); return;
  }

  /* ---- events */
  if (m === "evrules") {
    var en = whole("#s-evnotice", 0, 365, "The event notice period");
    var mg = whole("#s-evguests", 1, 1000, "The maximum guest count");
    if (en === null || mg === null) { render(); return; }
    setVal("event_notice_days", en); setVal("event_max_guests", mg);
    SET_MSG = "Saved."; save(); render(); return;
  }
  if (m === "evcancel") {
    var ef2 = whole("#s-evfree", 0, 2160, "The free cancellation window");
    var pc2 = whole("#s-evpct", 0, 100, "The late-cancellation charge");
    if (ef2 === null || pc2 === null) { render(); return; }
    setVal("event_free_cancellation_hours", ef2); setVal("late_cancellation_percent", pc2);
    SET_MSG = "Saved."; save(); render(); return;
  }
  /* Only changes what is selected. Nothing saves until Save is pressed. */
  if (m === "mode") { setVal("event_default_capacity_mode", t.dataset.mode); render(); return; }
  if (m === "band-add") { readLadder(); LADDER.push({ min: "", max: "", price: "" }); render(); return; }
  if (m === "band-del") { readLadder(); LADDER.splice(i, 1); render(); return; }
  if (m === "ladder") {
    readLadder();
    var ref = Number(String(LADDER_BASE).replace(/,/g, ""));
    if (!isFinite(ref) || ref <= 0) {
      SET_ERR = "Give the price of a dish to work the ladder out from."; render(); return;
    }
    var rows = [], bad = null;
    LADDER.forEach(function (r) {
      var lo = Number(r.min), hi = Number(r.max);
      var price = Number(String(r.price).replace(/,/g, ""));
      if (!lo || !hi || hi < lo) bad = bad || "Each band needs a guest count to run from and to.";
      if (!price || price <= 0) bad = bad || "Each band needs a price in EGP.";
      rows.push({ min: lo, max: hi, bp: Math.round((price / ref) * 10000) });
    });
    if (!rows.length) bad = "The ladder needs at least one band.";
    rows.sort(function (a, b) { return a.min - b.min; });
    for (var k = 1; k < rows.length; k++) {
      if (rows[k].min <= rows[k - 1].max) {
        bad = bad || "Those bands overlap. Every guest count can only fall in one band.";
      }
    }
    if (bad) { SET_ERR = bad; render(); return; }
    S.menu.tiers = rows;
    setVal("event_ladder_reference_piastres", String(Math.round(ref * 100)));
    loadLadder();
    SET_MSG = "Saved."; save(); render(); return;
  }

  /* ---- payment methods */
  if (m === "add-manual") { SET_ADD = "MANUAL"; NEW_VERIFY = true; render(); return; }
  if (m === "add-integrated") { SET_ADD = "INTEGRATED"; NEW_VERIFY = false; render(); return; }
  if (m === "add-serving") { SET_ADD = "SERVING"; render(); return; }
  if (m === "add-cancel") { SET_ADD = null; render(); return; }
  if (m === "new-verify") { NEW_VERIFY = !NEW_VERIFY; render(); return; }
  if (m === "pay-add") {
    var pn = val("#pm-name");
    if (!pn) { SET_ERR = "A payment method needs a name."; render(); return; }
    S.settings.payments.push({
      id: "pm-" + Date.now(), builtIn: null, name: pn, instructions: val("#pm-inst"),
      kind: SET_ADD, enabled: false, verify: SET_ADD === "MANUAL" ? NEW_VERIFY : false, used: 0
    });
    SET_ADD = null; save(); render(); return;
  }
  if (m === "pay-toggle") {
    var po = payBy(id);
    if (po.kind === "INTEGRATED") {
      SET_ERR = po.name + " needs its provider connected before customers can use it.";
      render(); return;
    }
    if (po.enabled) {
      var others = S.settings.payments.filter(function (o) {
        return o.id !== id && o.enabled && o.kind === "MANUAL";
      }).length;
      if (others === 0) {
        SET_ERR = "Customers need at least one way to pay. Turn another on first.";
        render(); return;
      }
    }
    po.enabled = !po.enabled; save(); render(); return;
  }
  if (m === "pay-edit") { SET_OPEN = SET_OPEN === id ? null : id; render(); return; }
  if (m === "pay-verify") { payBy(id).verify = !payBy(id).verify; render(); return; }
  if (m === "pay-save") {
    var pe = payBy(id);
    var nm = val("#pe-name");
    if (!nm) { SET_ERR = "A payment method needs a name."; render(); return; }
    pe.name = nm;
    if ($("#pe-inst")) pe.instructions = val("#pe-inst");
    SET_OPEN = null; SET_MSG = "Saved."; save(); render(); return;
  }
  if (m === "pay-remove") {
    var pr = payBy(id);
    if (pr.builtIn) { SET_ERR = pr.name + " is built in. Switch it off instead."; render(); return; }
    S.settings.payments = S.settings.payments.filter(function (o) { return o.id !== id; });
    SET_OPEN = null; save(); render(); return;
  }
  if (m === "instapay") {
    setVal("instapay_number", val("#s-ipn"));
    setVal("instapay_account_details", val("#s-ipd"));
    SET_MSG = "Saved."; save(); render(); return;
  }

  /* ---- serving options */
  if (m === "serv-add") {
    var sn = val("#so-name");
    if (!sn) { SET_ERR = "A serving option needs a name."; render(); return; }
    S.settings.servings.push({
      id: "so-" + Date.now(), builtIn: null, name: sn, description: val("#so-desc"),
      available: true, used: 0
    });
    SET_ADD = null; save(); render(); return;
  }
  if (m === "serv-toggle") {
    var so = servBy(id);
    if (so.available) {
      var left = S.settings.servings.filter(function (o) { return o.id !== id && o.available; }).length;
      if (left === 0) {
        SET_ERR = "Customers need at least one way to be served. Turn another on first.";
        render(); return;
      }
    }
    so.available = !so.available; save(); render(); return;
  }
  if (m === "serv-edit") { SET_OPEN = SET_OPEN === id ? null : id; render(); return; }
  if (m === "serv-save") {
    var se = servBy(id);
    var sname = val("#se-name");
    if (!sname) { SET_ERR = "A serving option needs a name."; render(); return; }
    se.name = sname; se.description = val("#se-desc");
    SET_OPEN = null; SET_MSG = "Saved."; save(); render(); return;
  }
  if (m === "serv-remove") {
    var sr = servBy(id);
    if (sr.builtIn) { SET_ERR = sr.name + " is built in. Switch it off instead."; render(); return; }
    S.settings.servings = S.settings.servings.filter(function (o) { return o.id !== id; });
    SET_OPEN = null; save(); render(); return;
  }
  if (m === "policy") {
    setVal("serving_setup_policy_en", val("#s-policy"));
    SET_MSG = "Saved."; save(); render(); return;
  }
});

/* --------------------------------------------------------------- chrome */
function chrome(inner) {
  var h = hash();
  var link = function (href, label, match) {
    return '<a href="' + href + '"' + (h === match ? ' class="on"' : "") + ">" + label + "</a>";
  };
  return '<header class="top no-print"><div class="in">'
    + '<a class="brand" href="#/">The Diine<span class="tag">Admin</span></a>'
    + "<nav>" + link("#/", "Today", "/") + link("#/orders", "Orders", "/orders")
    + link("#/kitchen", "Kitchen", "/kitchen")
    + '<a href="#/menu"' + (h.indexOf("/menu") === 0 ? ' class="on"' : "") + ">Menu</a>"
    + '<a href="#/settings"' + (h.indexOf("/settings") === 0 ? ' class="on"' : "") + ">Settings</a></nav>"
    + '<div class="who"><span>' + esc(S.admin.name) + "</span>"
    + '<button type="button" id="signout">Sign out</button></div>'
    + "</div></header>" + inner;
}

/* --------------------------------------------------------------- render */
var LOGIN_ERROR = null;
var PAY_CONFIRM = null;   /* a payment change that has asked but not been confirmed */
function render() {
  var h = hash();
  if (!S.signedIn) {
    $("#app").innerHTML = viewLogin(LOGIN_ERROR);
    LOGIN_ERROR = null;
    return;
  }
  var body;
  if (h.indexOf("/order/") === 0) body = viewOrder(decodeURIComponent(h.slice(7)));
  else if (h === "/menu/new") body = viewNewDish();
  else if (h === "/menu/categories") body = viewCourses();
  else if (h.indexOf("/menu/") === 0) body = viewDish(decodeURIComponent(h.slice(6)));
  else if (h === "/menu") body = viewMenu();
  else if (h === "/settings" || h === "/settings/business") body = viewSetBusiness();
  else if (h === "/settings/ordering") body = viewSetOrdering();
  else if (h === "/settings/delivery") body = viewSetDelivery();
  else if (h === "/settings/calendar") body = viewSetCalendar();
  else if (h === "/settings/events") body = viewSetEvents();
  else if (h === "/settings/payment") body = viewSetPayment();
  else if (h === "/settings/serving") body = viewSetServing();
  else if (h === "/orders") body = viewOrders();
  else if (h === "/kitchen") body = viewKitchen();
  else body = viewToday();
  $("#app").innerHTML = chrome(body);
}
window.addEventListener("hashchange", function () {
  PAY_CONFIRM = null; BANDS = null; EV_CHOICE = null; RETIRING = false; MENU_ERR = null;
  LADDER = null; SET_MSG = null; SET_ERR = null; SET_DAY = null; SET_ADD = null; SET_OPEN = null;
  if (!CARRY) MENU_MSG = null;
  CARRY = false;
  render();
  // Only a change of page goes back to the top; an edit stays where it was.
  window.scrollTo(0, 0);
});

/* ---------------------------------------------------------------- events */
document.addEventListener("submit", function (e) {
  if (e.target.id === "login-form") {
    e.preventDefault();
    var email = $("#email").value.trim().toLowerCase();
    var pw = $("#password").value;
    /* The same message either way, exactly as the real sign-in behaves. */
    if (email === "radwaserag@hotmail.com" && pw === "thediine-preview") {
      S.signedIn = true; save(); go("#/"); render();
    } else {
      LOGIN_ERROR = "That email and password do not match.";
      render();
    }
    return;
  }
  if (e.target.id === "search-form") {
    e.preventDefault();
    go(withQuery("/orders", { q: $("#q").value.trim() }));
  }
});

/* The event amounts follow the price while it is being typed, without a
   re-render, which would take the cursor out of the field. */
function refreshEventAmounts() {
  var h = hash();
  if (h.indexOf("/menu/") !== 0) return;
  var d = dishBy(decodeURIComponent(h.slice(6)));
  if (!d) return;
  var basis;
  if (d.v.length) {
    var picked = $("#evchoice") ? $("#evchoice").value : EV_CHOICE;
    var v = d.v.filter(function (x) { return x.name === picked; })[0] || d.v[0];
    basis = v ? v.price : null;
  } else {
    basis = $("#d-price") ? toPiastres($("#d-price").value) : d.price;
  }
  document.querySelectorAll("[data-ev-bp]").forEach(function (el) {
    var bp = Number(el.dataset.evBp);
    var lead = el.textContent.indexOf("=") === 0 ? "= " : "";
    el.textContent = lead + (basis === null || !isFinite(bp)
      ? "\u2014"
      : egp(Math.round((basis * bp) / 10000)));
  });
}
document.addEventListener("input", function (e) {
  if (e.target.id === "d-price") refreshEventAmounts();
  if (e.target.id === "dish-search") {
    SEARCH = e.target.value;
    var at = e.target.selectionStart;
    render();
    var again = $("#dish-search");
    if (again) { again.focus(); again.setSelectionRange(at, at); }
  }
});

document.addEventListener("change", function (e) {
  if (e.target.id === "evchoice") { EV_CHOICE = e.target.value; refreshEventAmounts(); }
  if (e.target.id === "kdate" && e.target.value) go("#/kitchen?date=" + e.target.value);
  if (e.target.id === "from") go(withQuery("/orders", { from: e.target.value }));
  if (e.target.id === "to") go(withQuery("/orders", { to: e.target.value }));
});

document.addEventListener("click", function (e) {
  var t = e.target.closest("button");
  if (!t) return;

  if (t.id === "reset") {
    /* Puts the sample orders back without signing you out. */
    var wasIn = S.signedIn;
    S = freshData(); S.signedIn = wasIn;
    save(); go("#/"); render(); return;
  }
  if (t.id === "signout") { S.signedIn = false; save(); render(); return; }
  if (t.id === "print") { window.print(); return; }

  if (t.id === "copy-addr") {
    var addr = t.dataset.addr;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(addr).then(function () {
        t.textContent = "Copied";
        setTimeout(function () { t.textContent = "Copy"; }, 2000);
      });
    }
    return;
  }

  var order = byNumber(decodeURIComponent(hash().slice(7)));

  /* The capacity choice on an EVENT page. Settings has its own buttons with a
     data-mode of their own, and they re-render themselves. */
  if (t.dataset.mode && !t.dataset.set) {
    document.querySelectorAll("[data-mode]:not([data-set])").forEach(function (b) {
      b.classList.toggle("on", b === t);
    });
    return;
  }
  if (t.id === "confirm-event" && order) {
    var chosen = document.querySelector("[data-mode].on");
    var mode = chosen ? chosen.dataset.mode : "BLOCK_DAY";
    order.history.push({ t: "Just now", from: "REQUESTED", to: "CONFIRMED", by: S.admin.name,
      note: mode === "BLOCK_DAY" ? "Confirmed; the day is blocked." : "Confirmed; the day stays open." });
    order.status = "CONFIRMED";
    order.capacityMode = mode;
    save(); render(); return;
  }

  if (t.dataset.to && order) {
    order.history.push({ t: "Just now", from: order.status, to: t.dataset.to, by: S.admin.name });
    order.status = t.dataset.to;
    save(); render(); return;
  }

  /* The payment, on its own. Undoing something asks first. */
  if (t.dataset.pay && order) {
    var to = t.dataset.pay;
    var undoing = to === "REFUNDED" || (to === "UNPAID" && order.payment === "PAID");
    if (undoing && PAY_CONFIRM !== to) { PAY_CONFIRM = to; render(); return; }
    PAY_CONFIRM = null;
    order.payment = to;
    var ref = $("#ref");
    if (ref && ref.value.trim()) order.reference = ref.value.trim();
    save(); render(); return;
  }
  if (t.id === "pay-never") { PAY_CONFIRM = null; render(); return; }

  if (t.id === "open-cancel" && order) { $("#cancel-slot").innerHTML = cancelBox(order); return; }
  if (t.id === "keep") {
    $("#cancel-slot").innerHTML =
      '<button type="button" class="link-danger" id="open-cancel">Cancel this order</button>';
    return;
  }
  if (t.id === "do-cancel" && order) {
    var terms = cancellationTerms({ type: order.type, date: order.date, total: total(order) });
    var reason = $("#reason") ? $("#reason").value.trim() : "";
    order.history.push({ t: "Just now", from: order.status, to: "CANCELLED", by: S.admin.name,
      note: terms.within ? "Cancelled inside the free window."
                         : "Cancelled late \u2014 " + terms.percent + "% recorded." });
    order.status = "CANCELLED";
    order.cancelReason = reason;
    order.cancelWithin = terms.within;
    order.cancelCharge = terms.charge;
    save(); render(); return;
  }
});

render();
</script>
