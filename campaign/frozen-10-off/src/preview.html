<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts/local.css"><style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1400px;height:1000px;background:#F4E5CE;font-family:'Karla',sans-serif;color:#3B2310}
.wrap{display:flex;gap:56px;justify-content:center;align-items:flex-end;padding:56px 40px 0}
.phone{width:390px;background:#111;border-radius:48px;padding:14px;box-shadow:0 40px 80px -30px rgba(59,35,16,.6)}
.screen{background:#fff;border-radius:36px;overflow:hidden;position:relative}
.ig{font-size:12px;padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee}
.ig .av{width:28px;height:28px;border-radius:50%;background:#FBF1E4;display:grid;place-items:center;overflow:hidden}.ig .av img{width:90%}
.ig b{font-weight:700}.ig span{color:#888;margin-left:auto}
.cap{font-size:12px;padding:10px 14px;line-height:1.45}.cap b{font-weight:700}
.story .screen{height:788px;background:#2A1809}
.story img{width:362px;display:block}
.label{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#A87E2E;text-align:center;margin-top:16px}
.col{display:flex;flex-direction:column;align-items:center}
.feed img{width:362px;display:block}
</style></head><body><div class="wrap">
<div class="col"><div class="phone feed"><div class="screen">
<div class="ig"><div class="av"><img src="logo.png"></div><b>thediine</b><span>Sponsored</span></div>
<img src="../out/01-feed-post-1080x1350.png">
<div class="cap"><b>thediine</b> Good things come frozen. 10% off the entire frozen menu until 30 November…</div>
</div></div><p class="label">Feed · 4:5</p></div>
<div class="col"><div class="phone feed"><div class="screen">
<div class="ig"><div class="av"><img src="logo.png"></div><b>thediine</b><span>2 / 2</span></div>
<img src="../out/02-carousel-slide-2-1080x1350.png">
<div class="cap"><b>thediine</b> Twenty dishes, cooked when you want them.</div>
</div></div><p class="label">Carousel · slide 2</p></div>
<div class="col"><div class="phone story"><div class="screen"><img src="../out/03-story-1080x1920.png" style="height:788px;width:auto;margin:0 auto"></div></div><p class="label">Story · 9:16</p></div>
</div></body></html>
