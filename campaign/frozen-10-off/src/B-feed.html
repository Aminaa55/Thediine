<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts/local.css"><link rel="stylesheet" href="shared.css">
<style>
html,body{background:var(--cream-toast)}
.canvas{height:1350px;background:linear-gradient(180deg,var(--cream-deep),var(--cream-toast));color:var(--ink)}
.phone{position:absolute;left:-30px;top:380px;width:600px;height:1100px;border-radius:44px;overflow:hidden;transform:rotate(-6deg);
  box-shadow:0 60px 90px -40px rgba(59,35,16,.6),0 0 0 10px var(--ink-deep),0 0 0 12px rgba(199,154,63,.6);background:var(--cream)}
.phone img{width:600px;display:block;position:absolute;left:0;top:-1130px}
.logo{right:72px;top:72px;width:104px;height:104px;background:var(--cream-warm);box-shadow:0 0 0 1px var(--line)}
.eyebrow{position:absolute;left:72px;top:104px;font-size:21px;color:var(--gold)}
h1{position:absolute;left:72px;top:170px;width:940px;font-weight:600;font-size:96px;line-height:1;letter-spacing:-.02em;color:var(--ink)}
h1 em{font-style:italic;font-weight:330;color:var(--gold)}
.side{position:absolute;left:600px;top:520px;width:420px}
.side .big{font-family:'Fraunces';font-weight:760;font-size:190px;line-height:.85;letter-spacing:-.05em;color:var(--ink)}
.side .off{font-family:'Karla';font-weight:700;font-size:34px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-top:6px}
.side .hair{margin:30px 0 22px;background:linear-gradient(90deg,rgba(168,126,46,.8),transparent)}
.side p{font-size:25px;line-height:1.5;color:var(--ink-soft)}
.side p b{color:var(--ink);font-weight:700}
.cta{position:absolute;left:600px;bottom:92px}
.pill{background:var(--ink);color:var(--cream);padding:20px 36px;font-size:25px}
</style></head><body><div class="canvas">
<div class="logo"><img src="logo.png" alt=""></div>
<div class="eyebrow">The frozen menu · The Diine</div>
<h1 class="display">A little more stocked.<br>A little <em>less stress.</em></h1>
<div class="phone"><img src="menu-phone.png" alt=""></div>
<div class="side"><div class="big">10%</div><div class="off">off</div><div class="hair"></div>
<p><b>The entire frozen menu,</b><br>twenty dishes ready to cook,<br><b>until 30 November.</b></p></div>
<div class="cta"><span class="pill">Order on the website <span class="arrow">→</span></span></div>
</div></body></html>
